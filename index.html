<!DOCTYPE html>
<html lang="de">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vorlesungsplanung</title>

<style>

/* =========================================================
   Grundlayout
========================================================= */

body {
    font-family: Arial, sans-serif;
    max-width: 1500px;
    margin: 30px auto;
    padding: 0 20px;
    background: #f4f6f8;
    color: #222;
}

h1 {
    margin-bottom: 8px;
}

#status {
    color: #666;
    margin-bottom: 20px;
}

#fehler {
    color: #b00020;
    white-space: pre-wrap;
    margin-bottom: 20px;
}


/* =========================================================
   Vergangenheit
========================================================= */

.vergangenheit-steuerung {
    margin-bottom: 22px;
}

.vergangenheit-button {
    padding: 10px 14px;
    border-radius: 7px;
    border: 1px solid #405d6f;
    background: white;
    color: #405d6f;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

.vergangenheit-button:hover {
    background: #dfeaf0;
}

#vergangenheit {
    display: none;
    margin-bottom: 28px;
}

#vergangenheit.aktiv {
    display: block;
}


/* =========================================================
   Tagesblöcke
========================================================= */

.tag {
    margin-bottom: 34px;
}

.tag-datum {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 12px;
}

.tag-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 18px;
}

.tag-grid.zwei {
    grid-template-columns: 1fr 1fr;
}


/* =========================================================
   Vorlesungen
========================================================= */

.vorlesung {
    border-radius: 12px;
    background: white;
    overflow: hidden;
    border: 2px solid #b7c0c6;
}

.vorlesung.eigen {
    border-color: #405d6f;
}

.vorlesung.eigen .vorlesung-kopf {
    background: #edf3f6;
}

.vorlesung.vergleich {
    border-color: #b87932;
}

.vorlesung.vergleich .vorlesung-kopf {
    background: #fff4e7;
}

.vorlesung.naechste {
    box-shadow: 0 0 0 4px rgba(64, 93, 111, 0.18);
}


/* =========================================================
   Vorlesungskopf
========================================================= */

.vorlesung-kopf {
    padding: 15px 18px;
    border-bottom: 1px solid #ddd;
}

.vorlesung-kopf-zeile {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 18px;
}

.vorlesung-titel {
    min-width: 0;
}

.vorlesung-kopf h2 {
    margin: 0 0 8px 0;
}

.vorlesung-aktionen {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 8px;
}


/* =========================================================
   Kennzeichnungen
========================================================= */

.serien-hinweis {
    display: inline-block;
    font-size: 12px;
    font-weight: bold;
    padding: 5px 8px;
    border-radius: 6px;
}

.serien-hinweis.eigen {
    color: #405d6f;
    background: #dfeaf0;
}

.serien-hinweis.vergleich {
    color: #925c20;
    background: #ffe4c4;
}

.naechste-marker {
    display: inline-block;
    margin-left: 8px;
    padding: 5px 8px;
    border-radius: 6px;
    background: #405d6f;
    color: white;
    font-size: 12px;
    font-weight: bold;
}


/* =========================================================
   Buttons
========================================================= */

.aktion-button,
.mail-button {
    display: inline-block;
    box-sizing: border-box;
    padding: 9px 12px;
    border-radius: 7px;
    background: white;
    text-decoration: none;
    font-family: inherit;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
}

.aktion-button {
    border: 1px solid #405d6f;
    color: #405d6f;
}

.aktion-button:hover {
    background: #dfeaf0;
}

.aktion-button:disabled {
    opacity: 0.55;
    cursor: default;
}

.mail-button {
    border: 1px solid #70808a;
    color: #405d6f;
}

.mail-button:hover {
    background: #e7eef2;
}


/* =========================================================
   Kompakte vergangene Vorlesung
========================================================= */

.kurzansicht {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;

    padding: 14px 18px;

    background: white;

    border: 1px solid #bfc7cc;
    border-radius: 9px;

    color: #5f6a71;
}

.kurzansicht.vergleich {
    border-color: #d0a36c;
    background: #fffaf4;
}

.kurz-info {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.kurz-titel {
    font-size: 16px;
    font-weight: bold;
}

.kurz-aktionen {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}


/* =========================================================
   Ladeanzeige für zukünftige Vorlesungen
========================================================= */

.lade-karte {
    padding: 18px;
    background: white;
    border: 1px solid #ccd2d6;
    border-radius: 10px;
    color: #777;
}

.lade-karte.vergleich {
    border-color: #d0a36c;
    background: #fffaf4;
}


/* =========================================================
   Lektionen
========================================================= */

.lektion {
    margin: 14px;
    padding: 14px;
    background: #f5f6f7;
    border-radius: 8px;
}

.lektion h3 {
    margin-top: 0;
    margin-bottom: 12px;
}


/* =========================================================
   Versuch
========================================================= */

.versuch {
    margin: 8px 0;
    padding: 10px 12px;

    background: white;

    border: 1px solid #ddd;
    border-radius: 6px;

    cursor: pointer;
}

.versuch:hover {
    background: #f0f3f5;
}

.versuch.aktiv {
    border-color: #607d8b;
    background: #f1f5f7;
}

.versuch-kopf {
    display: grid;
    grid-template-columns: 70px 1fr 24px;
    gap: 10px;
    align-items: center;
}

.reihenfolge {
    font-weight: bold;
    color: #405d6f;
}

.versuch-name {
    font-weight: 600;
}

.pfeil {
    text-align: right;
    color: #666;
}


/* =========================================================
   Versuchsdetails
========================================================= */

.versuch-detail {
    display: none;

    margin-top: 14px;
    padding-top: 14px;

    border-top: 1px solid #ddd;
}

.versuch.aktiv .versuch-detail {
    display: grid;
    grid-template-columns: minmax(180px, 34%) 1fr;
    gap: 18px;
}

.thumbnail-bereich {
    min-width: 0;
}

.versuch-thumbnail {
    width: 100%;
    max-width: 500px;
    max-height: 340px;

    object-fit: contain;

    display: block;

    background: white;

    border: 1px solid #ddd;
    border-radius: 8px;

    cursor: zoom-in;
}

.versuch-thumbnail:hover {
    opacity: 0.9;
}

.bild-hinweis {
    margin-top: 7px;
    font-size: 12px;
    color: #777;
}

.versuch-text {
    line-height: 1.5;
    white-space: pre-wrap;
}

.versuch-mail {
    margin-top: 18px;
}

.kein-bild {
    color: #777;
    font-style: italic;
}


/* =========================================================
   Lightbox
========================================================= */

#lightbox {
    display: none;

    position: fixed;
    inset: 0;

    z-index: 10000;

    background: rgba(0, 0, 0, 0.88);

    align-items: center;
    justify-content: center;

    padding: 30px;

    box-sizing: border-box;
}

#lightbox.aktiv {
    display: flex;
}

#lightboxBild {
    max-width: 95vw;
    max-height: 92vh;

    object-fit: contain;

    background: white;

    box-shadow: 0 0 25px rgba(0, 0, 0, 0.5);
}

#lightboxSchliessen {
    position: fixed;

    top: 15px;
    right: 22px;

    border: 0;

    background: transparent;
    color: white;

    font-size: 38px;

    cursor: pointer;
}


/* =========================================================
   Mobil
========================================================= */

@media (max-width: 950px) {

    .tag-grid.zwei {
        grid-template-columns: 1fr;
    }

    .versuch.aktiv .versuch-detail {
        grid-template-columns: 1fr;
    }

    .vorlesung-kopf-zeile,
    .kurzansicht {
        flex-direction: column;
        align-items: stretch;
    }

    .vorlesung-aktionen,
    .kurz-aktionen {
        justify-content: flex-start;
    }
}

</style>
</head>


<body>


<h1>Vorlesungsplanung</h1>

<div id="status">
    Vorlesungsplanung wird geladen …
</div>

<div id="fehler"></div>


<!-- ======================================================
     Frühere Vorlesungen
======================================================= -->

<div class="vergangenheit-steuerung">

    <button
        id="vergangenheitButton"
        class="vergangenheit-button">

        ↑ Frühere Vorlesungen anzeigen

    </button>

</div>


<div id="vergangenheit"></div>


<!-- ======================================================
     Aktuelle + zukünftige Vorlesungen
======================================================= -->

<div id="inhalt"></div>


<!-- ======================================================
     Lightbox
======================================================= -->

<div id="lightbox">

    <button
        id="lightboxSchliessen"
        aria-label="Bild schliessen">
        ×
    </button>

    <img
        id="lightboxBild"
        src=""
        alt="Versuchsbild">

</div>


<script>


/* =========================================================
   KONFIGURATION
========================================================= */

const MAIL_ADRESSE =
    "pi-demo.space@unibe.ch";


/*
    ========================================================
    TESTMODUS

    Aktuell:

    Stammvorlesungsserie 2
    Datum 09.05.2026

    Für den Produktivbetrieb später:

    const TEST_SERIE = null;
    const TEST_DATUM = null;
    ========================================================
*/

const TEST_SERIE =
    2;


const TEST_DATUM =
    new Date(
        2026,
        4,
        9
    );


/* =========================================================
   Globale Variablen
========================================================= */

let indexDaten =
    null;


let eigeneSerie =
    null;


let vergleichsSerie =
    null;


let vergleichAnzeigen =
    false;


let vergangenheitSichtbar =
    false;


let eigeneEintraege =
    [];


let vergleichsEintraege =
    [];


let vergangeneEigene =
    [];


let zukunftEigene =
    [];


let naechsterEigenerEintrag =
    null;


/*
    Bereits geladene Vorlesungsdateien
    bleiben im Arbeitsspeicher.
*/

const datenCache =
    new Map();


/* =========================================================
   Stammserie bestimmen
========================================================= */

const parameter =
    new URLSearchParams(
        window.location.search
    );


if (
    TEST_SERIE !== null
) {

    eigeneSerie =
        TEST_SERIE;

} else {

    eigeneSerie =
        Number(
            parameter.get(
                "serie"
            )
        );
}


/* =========================================================
   Datum
========================================================= */

function datumAusDeutsch(
    text
) {

    if (!text) {
        return null;
    }


    const teile =
        text.split(".");


    if (
        teile.length !== 3
    ) {

        return null;
    }


    return new Date(
        Number(
            teile[2]
        ),
        Number(
            teile[1]
        ) - 1,
        Number(
            teile[0]
        )
    );
}


function heuteOhneUhrzeit() {

    if (
        TEST_DATUM !== null
    ) {

        return new Date(
            TEST_DATUM.getFullYear(),
            TEST_DATUM.getMonth(),
            TEST_DATUM.getDate()
        );
    }


    const jetzt =
        new Date();


    return new Date(
        jetzt.getFullYear(),
        jetzt.getMonth(),
        jetzt.getDate()
    );
}


/* =========================================================
   Vorlesungsnummer formatieren
========================================================= */

function formatVorlesungsnummer(
    nummer
) {

    if (
        nummer === undefined
        ||
        nummer === null
    ) {

        return "";
    }


    return String(
        nummer
    ).padStart(
        2,
        "0"
    );
}


/* =========================================================
   Mail
========================================================= */

function mailLink(
    betreff,
    text = ""
) {

    return (
        "mailto:"
        +
        MAIL_ADRESSE
        +
        "?subject="
        +
        encodeURIComponent(
            betreff
        )
        +
        "&body="
        +
        encodeURIComponent(
            text
        )
    );
}


/* =========================================================
   Vorlesungsdatei laden
========================================================= */

async function ladeVorlesungsDatei(
    eintrag
) {

    if (
        datenCache.has(
            eintrag.datei
        )
    ) {

        return datenCache.get(
            eintrag.datei
        );
    }


    /*
        Nur index.json wird später mit no-store geladen.

        Die einzelnen Vorlesungsdateien dürfen vom
        Browser gecacht werden.
    */

    const antwort =
        await fetch(
            eintrag.datei
        );


    if (
        !antwort.ok
    ) {

        throw new Error(
            "Vorlesungsdatei konnte nicht geladen werden: "
            +
            eintrag.datei
        );
    }


    const daten =
        await antwort.json();


    datenCache.set(
        eintrag.datei,
        daten
    );


    return daten;
}


/* =========================================================
   Vergleichsserie bestimmen
========================================================= */

function bestimmeVergleichsSerie() {

    for (
        const eintrag
        of eigeneEintraege
    ) {

        if (
            eintrag.vergleichsserie !== undefined
            &&
            eintrag.vergleichsserie !== null
            &&
            Number(
                eintrag.vergleichsserie
            ) !== 0
        ) {

            return Number(
                eintrag.vergleichsserie
            );
        }
    }


    return null;
}


/* =========================================================
   Lightbox
========================================================= */

function oeffneLightbox(
    bildPfad,
    altText
) {

    if (
        !bildPfad
    ) {

        return;
    }


    const lightbox =
        document.getElementById(
            "lightbox"
        );


    const bild =
        document.getElementById(
            "lightboxBild"
        );


    /*
        Das grosse Bild wird erst geladen,
        wenn es wirklich angeklickt wird.
    */

    bild.src =
        bildPfad;


    bild.alt =
        altText || "";


    lightbox
        .classList
        .add(
            "aktiv"
        );


    document.body.style.overflow =
        "hidden";
}


function schliesseLightbox() {

    document
        .getElementById(
            "lightbox"
        )
        .classList
        .remove(
            "aktiv"
        );


    document
        .getElementById(
            "lightboxBild"
        )
        .src =
            "";


    document.body.style.overflow =
        "";
}


document
    .getElementById(
        "lightboxSchliessen"
    )
    .addEventListener(
        "click",
        schliesseLightbox
    );


document
    .getElementById(
        "lightbox"
    )
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target.id ===
                "lightbox"
            ) {

                schliesseLightbox();
            }
        }
    );


document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Escape"
        ) {

            schliesseLightbox();
        }
    }
);


/* =========================================================
   Versuch erzeugen
========================================================= */

function erzeugeVersuch(
    versuch,
    eintrag,
    vorlesungsDaten
) {

    const element =
        document.createElement(
            "div"
        );


    element.className =
        "versuch";


    /* -----------------------------------------------------
       Versuchskopf
    ----------------------------------------------------- */

    const kopf =
        document.createElement(
            "div"
        );


    kopf.className =
        "versuch-kopf";


    const reihenfolge =
        document.createElement(
            "div"
        );


    reihenfolge.className =
        "reihenfolge";


    reihenfolge.textContent =
        versuch.reihenfolge || "";


    const name =
        document.createElement(
            "div"
        );


    name.className =
        "versuch-name";


    name.textContent =
        versuch.versuch || "";


    const pfeil =
        document.createElement(
            "div"
        );


    pfeil.className =
        "pfeil";


    pfeil.textContent =
        "▾";


    kopf.appendChild(
        reihenfolge
    );


    kopf.appendChild(
        name
    );


    kopf.appendChild(
        pfeil
    );


    /* -----------------------------------------------------
       Detailbereich
    ----------------------------------------------------- */

    const detail =
        document.createElement(
            "div"
        );


    detail.className =
        "versuch-detail";


    /* -----------------------------------------------------
       Thumbnail
    ----------------------------------------------------- */

    const bildBereich =
        document.createElement(
            "div"
        );


    bildBereich.className =
        "thumbnail-bereich";


    if (
        Number(
            versuch.bild_vorhanden
        ) === 1
        &&
        versuch.bild
    ) {

        const thumbnail =
            document.createElement(
                "img"
            );


        thumbnail.className =
            "versuch-thumbnail";


        /*
            Wenn ein echtes Thumbnail vorhanden ist,
            verwenden wir dieses.

            Sonst dient das Originalbild als Fallback.
        */

        thumbnail.src =
            versuch.thumbnail
            ||
            versuch.bild;


        /*
            Bilder weit unten auf der Seite werden
            nicht sofort geladen.
        */

        thumbnail.loading =
            "lazy";


        thumbnail.decoding =
            "async";


        thumbnail.alt =
            versuch.versuch
            ||
            "Versuchsbild";


        thumbnail.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();


                oeffneLightbox(
                    versuch.bild,
                    versuch.versuch
                );
            }
        );


        bildBereich.appendChild(
            thumbnail
        );


        const hinweis =
            document.createElement(
                "div"
            );


        hinweis.className =
            "bild-hinweis";


        hinweis.textContent =
            "Bild anklicken für grosse Ansicht";


        bildBereich.appendChild(
            hinweis
        );

    } else {

        const keinBild =
            document.createElement(
                "div"
            );


        keinBild.className =
            "kein-bild";


        keinBild.textContent =
            "Kein Bild vorhanden.";


        bildBereich.appendChild(
            keinBild
        );
    }


    /* -----------------------------------------------------
       Text
    ----------------------------------------------------- */

    const textBereich =
        document.createElement(
            "div"
        );


    const text =
        document.createElement(
            "div"
        );


    text.className =
        "versuch-text";


    text.textContent =
        versuch.text
        ||
        "Keine Beschreibung vorhanden.";


    textBereich.appendChild(
        text
    );


    /* -----------------------------------------------------
       Mailbutton Versuch
    ----------------------------------------------------- */

    const mailBereich =
        document.createElement(
            "div"
        );


    mailBereich.className =
        "versuch-mail";


    const frageButton =
        document.createElement(
            "a"
        );


    frageButton.className =
        "mail-button";


    frageButton.textContent =
        "✉ Frage zum Versuch";


    frageButton.href =
        mailLink(

            "Frage zum Versuch: "
            +
            (
                versuch.versuch
                ||
                ""
            ),

            "Ich habe eine Frage zum Versuch „"
            +
            (
                versuch.versuch
                ||
                ""
            )
            +
            "“.\n\n"
            +
            "Vorlesung: "
            +
            vorlesungsDaten.vorlesung
            +
            "\n"
            +
            "Datum: "
            +
            eintrag.datum
            +
            "\n\n"
        );


    frageButton.addEventListener(
        "click",
        function(event) {

            event.stopPropagation();
        }
    );


    mailBereich.appendChild(
        frageButton
    );


    textBereich.appendChild(
        mailBereich
    );


    detail.appendChild(
        bildBereich
    );


    detail.appendChild(
        textBereich
    );


    element.appendChild(
        kopf
    );


    element.appendChild(
        detail
    );


    /* -----------------------------------------------------
       Versuch auf-/zuklappen
    ----------------------------------------------------- */

    element.addEventListener(
        "click",
        function() {

            const aktiv =
                element
                    .classList
                    .toggle(
                        "aktiv"
                    );


            pfeil.textContent =
                aktiv
                ?
                "▴"
                :
                "▾";
        }
    );


    return element;
}


/* =========================================================
   Vorlesungs-Mailbutton
========================================================= */

function erzeugeVorlesungsMailbutton(
    eintrag,
    vorlesungsnummer
) {

    const mail =
        document.createElement(
            "a"
        );


    mail.className =
        "mail-button";


    mail.textContent =
        "✉ Frage zur Vorlesung";


    mail.href =
        mailLink(

            "Frage zur Vorlesung "
            +
            vorlesungsnummer
            +
            " vom "
            +
            eintrag.datum,

            "Ich habe eine Frage zur Vorlesung "
            +
            vorlesungsnummer
            +
            " vom "
            +
            eintrag.datum
            +
            ".\n\n"
        );


    mail.addEventListener(
        "click",
        function(event) {

            event.stopPropagation();
        }
    );


    return mail;
}


/* =========================================================
   Vergleichsbutton
========================================================= */

function erzeugeVergleichsButton() {

    if (
        vergleichsSerie === null
    ) {

        return null;
    }


    const button =
        document.createElement(
            "button"
        );


    button.className =
        "aktion-button";


    button.textContent =
        vergleichAnzeigen
        ?
        "Vergleich ausblenden"
        :
        "Vergleich einblenden";


    button.addEventListener(
        "click",
        async function(event) {

            event.stopPropagation();


            vergleichAnzeigen =
                !vergleichAnzeigen;


            document
                .getElementById(
                    "status"
                )
                .textContent =
                    vergleichAnzeigen
                    ?
                    "Vergleich wird geladen …"
                    :
                    "Vergleich wird ausgeblendet …";


            if (
                vergleichAnzeigen
            ) {

                vergleichsEintraege =
                    indexDaten.vorlesungen
                        .filter(
                            eintrag =>
                                Number(
                                    eintrag.stammserie
                                )
                                ===
                                vergleichsSerie
                        )
                        .sort(
                            (a, b) =>
                                datumAusDeutsch(
                                    a.datum
                                )
                                -
                                datumAusDeutsch(
                                    b.datum
                                )
                        );

            } else {

                vergleichsEintraege =
                    [];
            }


            /*
                Hauptansicht neu zeichnen.

                Aktuelle und zukünftige Vorlesungen
                werden vollständig angezeigt.
            */

            await baueHauptansicht();


            /*
                Falls Vergangenheit gerade geöffnet ist,
                auch diese neu zeichnen.
            */

            if (
                vergangenheitSichtbar
            ) {

                baueVergangenheit();
            }


            document
                .getElementById(
                    "status"
                )
                .textContent =
                    "Stammvorlesungsserie "
                    +
                    eigeneSerie;
        }
    );


    return button;
}


/* =========================================================
   Vollständige Vorlesung
========================================================= */

function erzeugeVorlesung(
    eintrag,
    daten,
    typ,
    istNaechste
) {

    const element =
        document.createElement(
            "article"
        );


    element.className =
        "vorlesung "
        +
        typ;


    element.dataset.typ =
        typ;


    if (
        istNaechste
    ) {

        element.classList.add(
            "naechste"
        );
    }


    /* -----------------------------------------------------
       Kopf
    ----------------------------------------------------- */

    const kopf =
        document.createElement(
            "div"
        );


    kopf.className =
        "vorlesung-kopf";


    const kopfZeile =
        document.createElement(
            "div"
        );


    kopfZeile.className =
        "vorlesung-kopf-zeile";


    const titelBereich =
        document.createElement(
            "div"
        );


    titelBereich.className =
        "vorlesung-titel";


    const titel =
        document.createElement(
            "h2"
        );


    titel.textContent =
        "Vorlesung "
        +
        daten.vorlesung;


    const hinweis =
        document.createElement(
            "span"
        );


    hinweis.className =
        "serien-hinweis "
        +
        typ;


    hinweis.textContent =
        typ ===
        "eigen"
        ?
        "Ihre Vorlesungsserie"
        :
        "Vergleichsserie";


    titelBereich.appendChild(
        titel
    );


    titelBereich.appendChild(
        hinweis
    );


    if (
        istNaechste
    ) {

        const marker =
            document.createElement(
                "span"
            );


        marker.className =
            "naechste-marker";


        marker.textContent =
            "NÄCHSTE VORLESUNG";


        titelBereich.appendChild(
            marker
        );
    }


    kopfZeile.appendChild(
        titelBereich
    );


    /* -----------------------------------------------------
       Aktionen
    ----------------------------------------------------- */

    const aktionen =
        document.createElement(
            "div"
        );


    aktionen.className =
        "vorlesung-aktionen";


    aktionen.appendChild(

        erzeugeVorlesungsMailbutton(
            eintrag,
            daten.vorlesung
        )

    );


    if (
        typ ===
        "eigen"
    ) {

        const vergleichButton =
            erzeugeVergleichsButton();


        if (
            vergleichButton
        ) {

            aktionen.appendChild(
                vergleichButton
            );
        }
    }


    kopfZeile.appendChild(
        aktionen
    );


    kopf.appendChild(
        kopfZeile
    );


    element.appendChild(
        kopf
    );


    /* -----------------------------------------------------
       Lektionen
    ----------------------------------------------------- */

    const lektionen =
        Array.isArray(
            daten.lektionen
        )
        ?
        daten.lektionen
        :
        [];


    for (
        const lektion
        of lektionen
    ) {

        const lektionsElement =
            document.createElement(
                "div"
            );


        lektionsElement.className =
            "lektion";


        const lektionTitel =
            document.createElement(
                "h3"
            );


        lektionTitel.textContent =
            "Lektion "
            +
            lektion.lektion;


        lektionsElement.appendChild(
            lektionTitel
        );


        const versuche =
            Array.isArray(
                lektion.versuche
            )
            ?
            lektion.versuche
            :
            [];


        for (
            const versuch
            of versuche
        ) {

            lektionsElement.appendChild(

                erzeugeVersuch(
                    versuch,
                    eintrag,
                    daten
                )

            );
        }


        element.appendChild(
            lektionsElement
        );
    }


    return element;
}


/* =========================================================
   Kompakte Vorlesung

   Wird NUR für die Vergangenheit verwendet.
========================================================= */

function erzeugeKurzansicht(
    eintrag,
    typ
) {

    const element =
        document.createElement(
            "div"
        );


    element.className =
        "kurzansicht";


    if (
        typ ===

    ) {

        element.classList.add(
            "vergleich"
        );
    }


    element.dataset.typ =
        typ;


    const info =
        document.createElement(
            "div"
        );


    info.className =
        "kurz-info";


    const titel =
        document.createElement(
            "div"
        );


    titel.className =
        "kurz-titel";


    const nummer =
        formatVorlesungsnummer(
            eintrag.vorlesungsnummer
        );


    titel.textContent =
        "Vorlesung "
        +
        nummer;


    const hinweis =
        document.createElement(
            "span"
        );


    hinweis.className =
        "serien-hinweis "
        +
        typ;


    hinweis.textContent =
        typ ===
        "eigen"
        ?
        "Ihre Vorlesungsserie"
        :
        "Vergleichsserie";


    info.appendChild(
        titel
    );


    info.appendChild(
        hinweis
    );


    const aktionen =
        document.createElement(
            "div"
        );


    aktionen.className =
        "kurz-aktionen";


    /* -----------------------------------------------------
       Alte Vorlesung bei Bedarf vollständig laden
    ----------------------------------------------------- */

    const anzeigen =
        document.createElement(
            "button"
        );


    anzeigen.className =
        "aktion-button";


    anzeigen.textContent =

    anzeigen.addEventListener(
        "click",
        async function(event) {

            event.stopPropagation();


            anzeigen.disabled =
                true;


            anzeigen.textContent =
                "Wird geladen …";


            try {

                const daten =
                    await ladeVorlesungsDatei(
                        eintrag
                    );


                const voll =
                    erzeugeVorlesung(
                        eintrag,
                        daten,
                        typ,
                        false
                    );


                voll.dataset.typ =
                    typ;


                element.replaceWith(
                    voll
                );


                aktualisiereTagGrid(
                    voll.closest(
                        ".tag"
                    )
                );

            } catch (fehler) {

                console.error(
                    fehler
                );


                anzeigen.disabled =
                    false;


                anzeigen.textContent =
                    "Erneut versuchen";
            }
        }
    );


    aktionen.appendChild(
        anzeigen
    );


    /* -----------------------------------------------------
       Mail
    ----------------------------------------------------- */

    aktionen.appendChild(

        erzeugeVorlesungsMailbutton(
            eintrag,
            nummer
        )

    );


    /* -----------------------------------------------------
       Vergleich
    ----------------------------------------------------- */

    if (
        typ ===
        "eigen"
    ) {

        const vergleichButton =
            erzeugeVergleichsButton();


        if (
            vergleichButton
        ) {

            aktionen.appendChild(
                vergleichButton
            );
        }
    }


    element.appendChild(
        info
    );


    element.appendChild(
        aktionen
    );


    return element;
}


/* =========================================================
   Tagesblock
========================================================= */

function erzeugeTag(
    datum
) {

    const tag =
        document.createElement(
            "section"
        );


    tag.className =
        "tag";


    tag.dataset.datum =
        datum;


    const datumTitel =
        document.createElement(
            "div"
        );


    datumTitel.className =
        "tag-datum";


    datumTitel.textContent =
        datum;


    const grid =
        document.createElement(
            "div"
        );


    grid.className =
        "tag-grid";


    tag.appendChild(
        datumTitel
    );


    tag.appendChild(
        grid
    );


    return tag;
}


/* =========================================================
   Tages-Grid aktualisieren
========================================================= */

function aktualisiereTagGrid(
    tag
) {

    if (!tag) {
        return;
    }


    const grid =
        tag.querySelector(
            ".tag-grid"
        );


    if (!grid) {
        return;
    }


    const eigen =
        grid.querySelector(
            '[data-typ="eigen"]'
        );


    const vergleich =
        grid.querySelector(
            '[data-typ="vergleich"]'
        );


    if (
        eigen
        &&
        vergleich
    ) {

        grid.classList.add(
            "zwei"
        );

    } else {

        grid.classList.remove(
            "zwei"
        );
    }
}


/* =========================================================
   Einträge nach Datum gruppieren
========================================================= */

function gruppiereEintraege(
    eintraege
) {

    const map =
        new Map();


    for (
        const eintrag
        of eintraege
    ) {

        if (
            !map.has(
                eintrag.datum
            )
        ) {

            map.set(
                eintrag.datum,
                []
            );
        }


        map.get(
            eintrag.datum
        ).push(
            eintrag
        );
    }


    return map;
}


/* =========================================================
   Vergangenheit aufbauen

   WICHTIG:

   alt -> neu

   Dadurch steht die unmittelbar vorhergehende
   Vorlesung direkt oberhalb der aktuellen.
========================================================= */

function baueVergangenheit() {

    const container =
        document.getElementById(
            "vergangenheit"
        );


    container.innerHTML =
        "";


    const eintraege =
        vergangeneEigene.map(
            eintrag => ({
                ...eintrag,
                typ:
                    "eigen"
            })
        );


    /* -----------------------------------------------------
       Vergangene Vergleichsvorlesungen
    ----------------------------------------------------- */

    if (
        vergleichAnzeigen
    ) {

        const heute =
            heuteOhneUhrzeit();


        const alteVergleich =
            vergleichsEintraege
                .filter(
                    eintrag =>
                        datumAusDeutsch(
                            eintrag.datum
                        )
                        <
                        heute
                )
                .map(
                    eintrag => ({
                        ...eintrag,
                        typ:
                            "vergleich"
                    })
                );


        eintraege.push(
            ...alteVergleich
        );
    }


    /*
        ALT -> NEU

        Beispiel:

        11.04.
        18.04.
        25.04.
        02.05.
        ----------------
        aktuelle: 09.05.
    */

    eintraege.sort(
        (a, b) => {

            const differenz =
                datumAusDeutsch(
                    a.datum
                )
                -
                datumAusDeutsch(
                    b.datum
                );


            if (
                differenz !== 0
            ) {

                return differenz;
            }


            /*
                Bei gleichem Datum:
                eigene Serie links,
                Vergleich rechts.
            */

            return (
                a.typ ===
                "eigen"
                ?
                -1
                :
                1
            );
        }
    );


    const gruppiert =
        gruppiereEintraege(
            eintraege
        );


    for (
        const [
            datum,
            gruppe
        ]
        of gruppiert
    ) {

        const tag =
            erzeugeTag(
                datum
            );


        const grid =
            tag.querySelector(
                ".tag-grid"
            );


        for (
            const eintrag
            of gruppe
        ) {

            grid.appendChild(

                erzeugeKurzansicht(
                    eintrag,
                    eintrag.typ
                )

            );
        }


        container.appendChild(
            tag
        );


        aktualisiereTagGrid(
            tag
        );
    }
}


/* =========================================================
   HAUPTANSICHT

   Hier liegt jetzt der wichtige Unterschied:

   ALLE aktuellen und zukünftigen Vorlesungen
   werden vollständig geladen und angezeigt.

   Es gibt für die Zukunft KEINE Kurzansichten.
========================================================= */

async function baueHauptansicht() {

    const container =
        document.getElementById(
            "inhalt"
        );


    container.innerHTML =
        "";


    const eintraege =
        [];


    /* =====================================================
       Eigene aktuelle + zukünftige Vorlesungen
    ===================================================== */

    for (
        const eintrag
        of zukunftEigene
    ) {

        eintraege.push({
            ...eintrag,
            typ:
                "eigen"
        });
    }


    /* =====================================================
       Vergleich aktuelle + zukünftige Vorlesungen
    ===================================================== */

    if (
        vergleichAnzeigen
    ) {

        const heute =
            heuteOhneUhrzeit();


        const zukunftVergleich =
            vergleichsEintraege
                .filter(
                    eintrag =>
                        datumAusDeutsch(
                            eintrag.datum
                        )
                        >=
                        heute
                )
                .map(
                    eintrag => ({
                        ...eintrag,
                        typ:
                            "vergleich"
                    })
                );


        eintraege.push(
            ...zukunftVergleich
        );
    }


    /* =====================================================
       Chronologisch sortieren
    ===================================================== */

    eintraege.sort(
        (a, b) => {

            const differenz =
                datumAusDeutsch(
                    a.datum
                )
                -
                datumAusDeutsch(
                    b.datum
                );


            if (
                differenz !== 0
            ) {

                return differenz;
            }


            /*
                Gleicher Tag:

                eigene Serie zuerst,
                Vergleich danach.
            */

            return (
                a.typ ===
                "eigen"
                ?
                -1
                :
                1
            );
        }
    );


    /* =====================================================
       Tagesblöcke vorbereiten

       Zuerst erzeugen wir ALLE Termine sofort.

       Dadurch bleibt das Seitenlayout stabil.
    ===================================================== */

    const gruppiert =
        gruppiereEintraege(
            eintraege
        );


    const ladeAuftraege =
        [];


    for (
        const [
            datum,
            gruppe
        ]
        of gruppiert
    ) {

        const tag =
            erzeugeTag(
                datum
            );


        const grid =
            tag.querySelector(
                ".tag-grid"
            );


        container.appendChild(
            tag
        );


        for (
            const eintrag
            of gruppe
        ) {

            const platzhalter =
                document.createElement(
                    "div"
                );


            platzhalter.className =
                "lade-karte";


            if (
                eintrag.typ ===
                "vergleich"
            ) {

                platzhalter.classList.add(
                    "vergleich"
                );
            }


            platzhalter.dataset.typ =
                eintrag.typ;


            platzhalter.textContent =
                (
                    eintrag.typ ===
                    "vergleich"
                    ?
                    "Vergleichsvorlesung "
                    :
                    "Vorlesung "
                )
                +
                formatVorlesungsnummer(
                    eintrag.vorlesungsnummer
                )
                +
                " wird geladen …";


            grid.appendChild(
                platzhalter
            );


            ladeAuftraege.push({

                eintrag:
                    eintrag,

                platzhalter:
                    platzhalter,

                tag:
                    tag
            });
        }


        aktualisiereTagGrid(
            tag
        );
    }


    /* =====================================================
       Jetzt alle Vorlesungen vollständig laden.

       Promise.all bedeutet:

       Die JSON-Dateien werden parallel angefordert,
       nicht langsam eine nach der anderen.
    ===================================================== */

    await Promise.all(

        ladeAuftraege.map(

            async function(auftrag) {

                const eintrag =
                    auftrag.eintrag;


                const istNaechste =
                    eintrag.typ ===
                    "eigen"
                    &&
                    naechsterEigenerEintrag
                    &&
                    eintrag.datei ===
                    naechsterEigenerEintrag.datei;


                try {

                    const daten =
                        await ladeVorlesungsDatei(
                            eintrag
                        );


                    const voll =
                        erzeugeVorlesung(
                            eintrag,
                            daten,
                            eintrag.typ,
                            istNaechste
                        );


                    voll.dataset.typ =
                        eintrag.typ;


                    auftrag
                        .platzhalter
                        .replaceWith(
                            voll
                        );


                    aktualisiereTagGrid(
                        auftrag.tag
                    );


                } catch (fehler) {

                    console.error(
                        fehler
                    );


                    auftrag
                        .platzhalter
                        .textContent =
                            "Vorlesung konnte nicht geladen werden.";
                }
            }
        )
    );
}


/* =========================================================
   Vergangenheit ein-/ausblenden

   Beim Öffnen bleibt die aktuelle Vorlesung an
   derselben Bildschirmposition.

   Die Vergangenheit wächst dadurch optisch
   NACH OBEN.
========================================================= */

document
    .getElementById(
        "vergangenheitButton"
    )
    .addEventListener(
        "click",
        function() {

            const vergangenheit =
                document.getElementById(
                    "vergangenheit"
                );


            const button =
                document.getElementById(
                    "vergangenheitButton"
                );


            /*
                Ersten aktuellen/zukünftigen Tagesblock
                als Anker verwenden.
            */

            const anker =
                document
                    .getElementById(
                        "inhalt"
                    )
                    .querySelector(
                        ".tag"
                    );


            let altePosition =
                null;


            if (
                anker
            ) {

                altePosition =
                    anker
                        .getBoundingClientRect()
                        .top;
            }


            vergangenheitSichtbar =
                !vergangenheitSichtbar;


            if (
                vergangenheitSichtbar
            ) {

                /*
                    Nur kompakte vergangene Karten erzeugen.

                    Es werden dabei KEINE alten
                    Vorlesungs-JSON-Dateien geladen.
                */

                baueVergangenheit();


                vergangenheit
                    .classList
                    .add(
                        "aktiv"
                    );


                button.textContent =
                    "↓ Frühere Vorlesungen ausblenden";

            } else {

                vergangenheit
                    .classList
                    .remove(
                        "aktiv"
                    );


                button.textContent =
                    "↑ Frühere Vorlesungen anzeigen";
            }


            /*
                Browser das neue Layout berechnen lassen.
            */

            requestAnimationFrame(
                function() {

                    if (
                        !anker
                        ||
                        altePosition ===
                        null
                    ) {

                        return;
                    }


                    const neuePosition =
                        anker
                            .getBoundingClientRect()
                            .top;


                    /*
                        Höhenänderung ausgleichen.

                        Dadurch bewegt sich die aktuelle
                        Vorlesung auf dem Bildschirm nicht.

                        Die Vergangenheit erscheint oberhalb.
                    */

                    window.scrollBy(
                        0,
                        neuePosition
                        -
                        altePosition
                    );
                }
            );
        }
    );


/* =========================================================
   Start
========================================================= */

async function starteSeite() {

    try {

        /* -------------------------------------------------
           Serie prüfen
        ------------------------------------------------- */

        if (
            !eigeneSerie
            ||
            Number.isNaN(
                eigeneSerie
            )
        ) {

            throw new Error(
                "Keine gültige Stammvorlesungsserie angegeben."
            );
        }


        /* -------------------------------------------------
           Zentralen Index laden

           index.json immer frisch.
        ------------------------------------------------- */

        const antwort =
            await fetch(
                "index.json",
                {
                    cache:
                        "no-store"
                }
            );


        if (
            !antwort.ok
        ) {

            throw new Error(
                "index.json konnte nicht geladen werden."
            );
        }


        indexDaten =
            await antwort.json();


        if (
            !indexDaten
            ||
            !Array.isArray(
                indexDaten.vorlesungen
            )
        ) {

            throw new Error(
                "index.json enthält keine gültige Vorlesungsliste."
            );
        }


        /* -------------------------------------------------
           Eigene Serie
        ------------------------------------------------- */

        eigeneEintraege =
            indexDaten.vorlesungen
                .filter(
                    eintrag =>
                        Number(
                            eintrag.stammserie
                        )
                        ===
                        eigeneSerie
                )
                .sort(
                    (a, b) =>
                        datumAusDeutsch(
                            a.datum
                        )
                        -
                        datumAusDeutsch(
                            b.datum
                        )
                );


        if (
            eigeneEintraege.length ===
            0
        ) {

            throw new Error(
                "Für die Stammvorlesungsserie "
                +
                eigeneSerie
                +
                " wurden keine Vorlesungen gefunden."
            );
        }


        /* -------------------------------------------------
           Vergleichsserie bestimmen
        ------------------------------------------------- */

        vergleichsSerie =
            bestimmeVergleichsSerie();


        /* -------------------------------------------------
           Vergangenheit / Zukunft aufteilen
        ------------------------------------------------- */

        const heute =
            heuteOhneUhrzeit();


        vergangeneEigene =
            eigeneEintraege.filter(
                eintrag =>
                    datumAusDeutsch(
                        eintrag.datum
                    )
                    <
                    heute
            );


        zukunftEigene =
            eigeneEintraege.filter(
                eintrag =>
                    datumAusDeutsch(
                        eintrag.datum
                    )
                    >=
                    heute
            );


        /* -------------------------------------------------
           Nächste Vorlesung
        ------------------------------------------------- */

        naechsterEigenerEintrag =
            zukunftEigene[0]
            ||
            null;


        /*
            Sonderfall:

            Das ganze Semester ist bereits vorbei.

            Dann verwenden wir die letzte Vorlesung
            als Einstieg.
        */

        if (
            !naechsterEigenerEintrag
        ) {

            naechsterEigenerEintrag =
                eigeneEintraege[
                    eigeneEintraege.length
                    -
                    1
                ];


            /*
                Diese Vorlesung soll nicht gleichzeitig
                oben in der Vergangenheit UND unten
                vollständig erscheinen.
            */

            vergangeneEigene =
                vergangeneEigene.filter(
                    eintrag =>
                        eintrag.datei !==
                        naechsterEigenerEintrag.datei
                );


            zukunftEigene =
                [
                    naechsterEigenerEintrag
                ];
        }


        /* -------------------------------------------------
           Hauptansicht

           ALLE aktuellen und zukünftigen Vorlesungen
           werden vollständig geladen.
        ------------------------------------------------- */

        await baueHauptansicht();


        document
            .getElementById(
                "status"
            )
            .textContent =
                "Stammvorlesungsserie "
                +
                eigeneSerie;


        /* -------------------------------------------------
           Vergangenheit-Button nur anzeigen,
           wenn es auch frühere Vorlesungen gibt.
        ------------------------------------------------- */

        if (
            vergangeneEigene.length ===
            0
        ) {

            document
                .querySelector(
                    ".vergangenheit-steuerung"
                )
                .style.display =
                    "none";
        }


    } catch (fehler) {

        document
            .getElementById(
                "status"
            )
            .textContent =
                "Fehler";


        document
            .getElementById(
                "fehler"
            )
            .textContent =
                fehler.message;


        console.error(
            fehler
        );
    }
}
