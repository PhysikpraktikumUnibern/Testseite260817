<!DOCTYPE html>
<html lang="de">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vorlesungsplanung</title>

<style>

body {
    font-family: Arial, sans-serif;
    max-width: 1500px;
    margin: 30px auto;
    padding: 0 20px;
    background: #f4f6f8;
    color: #222;
}

h1 {
    margin-bottom: 8px;
}

#status {
    color: #666;
    margin-bottom: 20px;
}

#fehler {
    color: #b00020;
    white-space: pre-wrap;
    margin-bottom: 20px;
}


/* =========================================================
   Navigation Vergangenheit
========================================================= */

.vergangenheit-steuerung {
    margin-bottom: 22px;
}

.vergangenheit-button {
    padding: 10px 14px;
    border-radius: 7px;
    border: 1px solid #405d6f;
    background: white;
    color: #405d6f;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

.vergangenheit-button:hover {
    background: #dfeaf0;
}

#vergangenheit {
    display: none;
    margin-bottom: 28px;
}

#vergangenheit.aktiv {
    display: block;
}


/* =========================================================
   Tagesblock
========================================================= */

.tag {
    margin-bottom: 34px;
}

.tag-datum {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 12px;
}

.tag-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 18px;
}

.tag-grid.zwei {
    grid-template-columns: 1fr 1fr;
}


/* =========================================================
   Vorlesung
========================================================= */

.vorlesung {
    border-radius: 12px;
    background: white;
    overflow: hidden;
    border: 2px solid #b7c0c6;
}

.vorlesung.eigen {
    border-color: #405d6f;
}

.vorlesung.eigen .vorlesung-kopf {
    background: #edf3f6;
}

.vorlesung.vergleich {
    border-color: #b87932;
}

.vorlesung.vergleich .vorlesung-kopf {
    background: #fff4e7;
}

.vorlesung.naechste {
    box-shadow: 0 0 0 4px rgba(64, 93, 111, 0.18);
}


/* =========================================================
   Vorlesungskopf
========================================================= */

.vorlesung-kopf {
    padding: 15px 18px;
    border-bottom: 1px solid #ddd;
}

.vorlesung-kopf-zeile {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 18px;
}

.vorlesung-titel {
    min-width: 0;
}

.vorlesung-kopf h2 {
    margin: 0 0 8px 0;
}

.vorlesung-aktionen {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 8px;
}


/* =========================================================
   Hinweise
========================================================= */

.serien-hinweis {
    display: inline-block;
    font-size: 12px;
    font-weight: bold;
    padding: 5px 8px;
    border-radius: 6px;
}

.serien-hinweis.eigen {
    color: #405d6f;
    background: #dfeaf0;
}

.serien-hinweis.vergleich {
    color: #925c20;
    background: #ffe4c4;
}

.naechste-marker {
    display: inline-block;
    margin-left: 8px;
    padding: 5px 8px;
    border-radius: 6px;
    background: #405d6f;
    color: white;
    font-size: 12px;
    font-weight: bold;
}


/* =========================================================
   Buttons
========================================================= */

.aktion-button,
.mail-button {
    display: inline-block;
    box-sizing: border-box;
    padding: 9px 12px;
    border-radius: 7px;
    background: white;
    text-decoration: none;
    font-family: inherit;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
}

.aktion-button {
    border: 1px solid #405d6f;
    color: #405d6f;
}

.aktion-button:hover {
    background: #dfeaf0;
}

.mail-button {
    border: 1px solid #70808a;
    color: #405d6f;
}

.mail-button:hover {
    background: #e7eef2;
}


/* =========================================================
   Kompakte Vorlesung
========================================================= */

.kurzansicht {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 14px 18px;
    background: white;
    border: 1px solid #bfc7cc;
    border-radius: 9px;
}

.kurzansicht.vergleich {
    border-color: #d0a36c;
    background: #fffaf4;
}

.kurz-info {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.kurz-titel {
    font-size: 16px;
    font-weight: bold;
}

.kurz-aktionen {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}


/* =========================================================
   Lektionen
========================================================= */

.lektion {
    margin: 14px;
    padding: 14px;
    background: #f5f6f7;
    border-radius: 8px;
}

.lektion h3 {
    margin-top: 0;
    margin-bottom: 12px;
}


/* =========================================================
   Versuch
========================================================= */

.versuch {
    margin: 8px 0;
    padding: 10px 12px;
    background: white;
    border: 1px solid #ddd;
    border-radius: 6px;
    cursor: pointer;
}

.versuch:hover {
    background: #f0f3f5;
}

.versuch.aktiv {
    border-color: #607d8b;
    background: #f1f5f7;
}

.versuch-kopf {
    display: grid;
    grid-template-columns: 70px 1fr 24px;
    gap: 10px;
    align-items: center;
}

.reihenfolge {
    font-weight: bold;
    color: #405d6f;
}

.versuch-name {
    font-weight: 600;
}

.pfeil {
    text-align: right;
    color: #666;
}


/* =========================================================
   Details
========================================================= */

.versuch-detail {
    display: none;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid #ddd;
}

.versuch.aktiv .versuch-detail {
    display: grid;
    grid-template-columns: minmax(180px, 34%) 1fr;
    gap: 18px;
}

.versuch-thumbnail {
    width: 100%;
    max-width: 500px;
    max-height: 340px;
    object-fit: contain;
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    cursor: zoom-in;
    display: block;
}

.bild-hinweis {
    margin-top: 7px;
    font-size: 12px;
    color: #777;
}

.versuch-text {
    line-height: 1.5;
    white-space: pre-wrap;
}

.versuch-mail {
    margin-top: 18px;
}

.kein-bild {
    color: #777;
    font-style: italic;
}


/* =========================================================
   Lightbox
========================================================= */

#lightbox {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10000;
    background: rgba(0, 0, 0, 0.88);
    align-items: center;
    justify-content: center;
    padding: 30px;
}

#lightbox.aktiv {
    display: flex;
}

#lightboxBild {
    max-width: 95vw;
    max-height: 92vh;
    object-fit: contain;
    background: white;
}

#lightboxSchliessen {
    position: fixed;
    top: 15px;
    right: 22px;
    border: 0;
    background: transparent;
    color: white;
    font-size: 38px;
    cursor: pointer;
}


/* =========================================================
   Mobil
========================================================= */

@media (max-width: 950px) {

    .tag-grid.zwei {
        grid-template-columns: 1fr;
    }

    .versuch.aktiv .versuch-detail {
        grid-template-columns: 1fr;
    }

    .vorlesung-kopf-zeile,
    .kurzansicht {
        flex-direction: column;
        align-items: stretch;
    }

    .vorlesung-aktionen,
    .kurz-aktionen {
        justify-content: flex-start;
    }
}

</style>
</head>


<body>

<h1>Vorlesungsplanung</h1>

<div id="status">
    Vorlesungsplanung wird geladen …
</div>

<div id="fehler"></div>


<div class="vergangenheit-steuerung">

    <button
        id="vergangenheitButton"
        class="vergangenheit-button">
        ↑ Frühere Vorlesungen anzeigen
    </button>

</div>


<div id="vergangenheit"></div>

<div id="inhalt"></div>


<div id="lightbox">

    <button id="lightboxSchliessen">
        ×
    </button>

    <img
        id="lightboxBild"
        src=""
        alt="Versuchsbild">

</div>


<script>


/* =========================================================
   KONFIGURATION
========================================================= */

const MAIL_ADRESSE =
    "pi-demo.space@unibe.ch";


/*
    TESTMODUS

    aktuell:
    Serie 2
    09.05.2026

    Produktiv später:

    const TEST_SERIE = null;
    const TEST_DATUM = null;
*/

const TEST_SERIE = 2;

const TEST_DATUM =
    new Date(2026, 4, 9);


/* =========================================================
   Globale Variablen
========================================================= */

let indexDaten = null;

let eigeneSerie = null;

let vergleichsSerie = null;

let vergleichAnzeigen = false;

let vergangenheitSichtbar = false;

let eigeneEintraege = [];

let vergleichsEintraege = [];

let vergangeneEigene = [];

let zukunftEigene = [];

let naechsterEigenerEintrag = null;

const datenCache =
    new Map();


/* =========================================================
   Serie bestimmen
========================================================= */

const parameter =
    new URLSearchParams(
        window.location.search
    );


eigeneSerie =
    TEST_SERIE !== null
    ?
    TEST_SERIE
    :
    Number(
        parameter.get("serie")
    );


/* =========================================================
   Datum
========================================================= */

function datumAusDeutsch(text) {

    const teile =
        text.split(".");

    return new Date(
        Number(teile[2]),
        Number(teile[1]) - 1,
        Number(teile[0])
    );
}


function heuteOhneUhrzeit() {

    if (
        TEST_DATUM !== null
    ) {

        return new Date(
            TEST_DATUM.getFullYear(),
            TEST_DATUM.getMonth(),
            TEST_DATUM.getDate()
        );
    }


    const jetzt =
        new Date();

    return new Date(
        jetzt.getFullYear(),
        jetzt.getMonth(),
        jetzt.getDate()
    );
}


/* =========================================================
   Mail
========================================================= */

function mailLink(
    betreff,
    text = ""
) {

    return (
        "mailto:"
        +
        MAIL_ADRESSE
        +
        "?subject="
        +
        encodeURIComponent(betreff)
        +
        "&body="
        +
        encodeURIComponent(text)
    );
}


/* =========================================================
   JSON laden
========================================================= */

async function ladeVorlesungsDatei(
    eintrag
) {

    if (
        datenCache.has(
            eintrag.datei
        )
    ) {

        return datenCache.get(
            eintrag.datei
        );
    }


    const antwort =
        await fetch(
            eintrag.datei
        );


    if (!antwort.ok) {

        throw new Error(
            "Vorlesungsdatei konnte nicht geladen werden: "
            +
            eintrag.datei
        );
    }


    const daten =
        await antwort.json();


    datenCache.set(
        eintrag.datei,
        daten
    );


    return daten;
}


/* =========================================================
   Vergleich bestimmen
========================================================= */

function bestimmeVergleichsSerie() {

    for (
        const eintrag
        of eigeneEintraege
    ) {

        if (
            eintrag.vergleichsserie !== undefined
            &&
            eintrag.vergleichsserie !== null
            &&
            Number(
                eintrag.vergleichsserie
            ) !== 0
        ) {

            return Number(
                eintrag.vergleichsserie
            );
        }
    }


    return null;
}


/* =========================================================
   Lightbox
========================================================= */

function oeffneLightbox(
    pfad,
    alt
) {

    const lightbox =
        document.getElementById(
            "lightbox"
        );

    const bild =
        document.getElementById(
            "lightboxBild"
        );


    bild.src =
        pfad;

    bild.alt =
        alt || "";


    lightbox.classList.add(
        "aktiv"
    );

    document.body.style.overflow =
        "hidden";
}


function schliesseLightbox() {

    document
        .getElementById(
            "lightbox"
        )
        .classList
        .remove("aktiv");


    document
        .getElementById(
            "lightboxBild"
        )
        .src =
            "";


    document.body.style.overflow =
        "";
}


document
    .getElementById(
        "lightboxSchliessen"
    )
    .addEventListener(
        "click",
        schliesseLightbox
    );


document
    .getElementById(
        "lightbox"
    )
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target.id ===
                "lightbox"
            ) {

                schliesseLightbox();
            }
        }
    );


document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Escape"
        ) {

            schliesseLightbox();
        }
    }
);


/* =========================================================
   Versuch
========================================================= */

function erzeugeVersuch(
    versuch,
    eintrag,
    vorlesungsDaten
) {

    const element =
        document.createElement("div");

    element.className =
        "versuch";


    const kopf =
        document.createElement("div");

    kopf.className =
        "versuch-kopf";


    const reihenfolge =
        document.createElement("div");

    reihenfolge.className =
        "reihenfolge";

    reihenfolge.textContent =
        versuch.reihenfolge || "";


    const name =
        document.createElement("div");

    name.className =
        "versuch-name";

    name.textContent =
        versuch.versuch || "";


    const pfeil =
        document.createElement("div");

    pfeil.className =
        "pfeil";

    pfeil.textContent =
        "▾";


    kopf.appendChild(
        reihenfolge
    );

    kopf.appendChild(
        name
    );

    kopf.appendChild(
        pfeil
    );


    const detail =
        document.createElement("div");

    detail.className =
        "versuch-detail";


    const bildBereich =
        document.createElement("div");


    if (
        Number(
            versuch.bild_vorhanden
        ) === 1
        &&
        versuch.bild
    ) {

        const thumbnail =
            document.createElement("img");


        thumbnail.className =
            "versuch-thumbnail";


        thumbnail.src =
            versuch.thumbnail
            ||
            versuch.bild;


        thumbnail.loading =
            "lazy";

        thumbnail.decoding =
            "async";


        thumbnail.alt =
            versuch.versuch || "";


        thumbnail.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();

                oeffneLightbox(
                    versuch.bild,
                    versuch.versuch
                );
            }
        );


        bildBereich.appendChild(
            thumbnail
        );


        const hinweis =
            document.createElement("div");

        hinweis.className =
            "bild-hinweis";

        hinweis.textContent =
            "Bild anklicken für grosse Ansicht";


        bildBereich.appendChild(
            hinweis
        );

    } else {

        const keinBild =
            document.createElement("div");

        keinBild.className =
            "kein-bild";

        keinBild.textContent =
            "Kein Bild vorhanden.";


        bildBereich.appendChild(
            keinBild
        );
    }


    const textBereich =
        document.createElement("div");


    const text =
        document.createElement("div");

    text.className =
        "versuch-text";

    text.textContent =
        versuch.text
        ||
        "Keine Beschreibung vorhanden.";


    textBereich.appendChild(
        text
    );


    const mailBereich =
        document.createElement("div");

    mailBereich.className =
        "versuch-mail";


    const frage =
        document.createElement("a");

    frage.className =
        "mail-button";

    frage.textContent =
        "✉ Frage zum Versuch";


    frage.href =
        mailLink(

            "Frage zum Versuch: "
            +
            (
                versuch.versuch || ""
            ),

            "Ich habe eine Frage zum Versuch „"
            +
            (
                versuch.versuch || ""
            )
            +
            "“.\n\n"
            +
            "Vorlesung: "
            +
            vorlesungsDaten.vorlesung
            +
            "\n"
            +
            "Datum: "
            +
            eintrag.datum
            +
            "\n\n"
        );


    frage.addEventListener(
        "click",
        function(event) {

            event.stopPropagation();
        }
    );


    mailBereich.appendChild(
        frage
    );


    textBereich.appendChild(
        mailBereich
    );


    detail.appendChild(
        bildBereich
    );

    detail.appendChild(
        textBereich
    );


    element.appendChild(
        kopf
    );

    element.appendChild(
        detail
    );


    element.addEventListener(
        "click",
        function() {

            const aktiv =
                element.classList.toggle(
                    "aktiv"
                );

            pfeil.textContent =
                aktiv
                ? "▴"
                : "▾";
        }
    );


    return element;
}


/* =========================================================
   Mailbutton Vorlesung
========================================================= */

function erzeugeVorlesungsMailbutton(
    eintrag,
    nummer
) {

    const mail =
        document.createElement("a");

    mail.className =
        "mail-button";

    mail.textContent =
        "✉ Frage zur Vorlesung";


    mail.href =
        mailLink(

            "Frage zur Vorlesung "
            +
            nummer
            +
            " vom "
            +
            eintrag.datum,

            "Ich habe eine Frage zur Vorlesung "
            +
            nummer
            +
            " vom "
            +
            eintrag.datum
            +
            ".\n\n"
        );


    mail.addEventListener(
        "click",
        function(event) {

            event.stopPropagation();
        }
    );


    return mail;
}


/* =========================================================
   Vergleich
========================================================= */

function erzeugeVergleichsButton() {

    if (
        vergleichsSerie === null
    ) {

        return null;
    }


    const button =
        document.createElement("button");

    button.className =
        "aktion-button";


    button.textContent =
        vergleichAnzeigen
        ?
        "Vergleich ausblenden"
        :
        "Vergleich einblenden";


    button.addEventListener(
        "click",
        async function(event) {

            event.stopPropagation();


            vergleichAnzeigen =
                !vergleichAnzeigen;


            if (
                vergleichAnzeigen
            ) {

                vergleichsEintraege =
                    indexDaten.vorlesungen
                        .filter(
                            eintrag =>
                                Number(
                                    eintrag.stammserie
                                )
                                ===
                                vergleichsSerie
                        )
                        .sort(
                            (a, b) =>
                                datumAusDeutsch(
                                    a.datum
                                )
                                -
                                datumAusDeutsch(
                                    b.datum
                                )
                        );

            } else {

                vergleichsEintraege =
                    [];
            }


            await baueHauptansicht();

            baueVergangenheit();
        }
    );


    return button;
}


/* =========================================================
   Volle Vorlesung
========================================================= */

function erzeugeVorlesung(
    eintrag,
    daten,
    typ,
    istNaechste
) {

    const element =
        document.createElement("article");


    element.className =
        "vorlesung "
        +
        typ;


    element.dataset.typ =
        typ;


    if (
        istNaechste
    ) {

        element.classList.add(
            "naechste"
        );
    }


    const kopf =
        document.createElement("div");

    kopf.className =
        "vorlesung-kopf";


    const kopfZeile =
        document.createElement("div");

    kopfZeile.className =
        "vorlesung-kopf-zeile";


    const titelBereich =
        document.createElement("div");

    titelBereich.className =
        "vorlesung-titel";


    const titel =
        document.createElement("h2");

    titel.textContent =
        "Vorlesung "
        +
        daten.vorlesung;


    const hinweis =
        document.createElement("span");

    hinweis.className =
        "serien-hinweis "
        +
        typ;


    hinweis.textContent =
        typ === "eigen"
        ?
        "Ihre Vorlesungsserie"
        :
        "Vergleichsserie";


    titelBereich.appendChild(
        titel
    );

    titelBereich.appendChild(
        hinweis
    );


    if (
        istNaechste
    ) {

        const marker =
            document.createElement("span");

        marker.className =
            "naechste-marker";

        marker.textContent =
            "NÄCHSTE VORLESUNG";


        titelBereich.appendChild(
            marker
        );
    }


    kopfZeile.appendChild(
        titelBereich
    );


    const aktionen =
        document.createElement("div");

    aktionen.className =
        "vorlesung-aktionen";


    aktionen.appendChild(
        erzeugeVorlesungsMailbutton(
            eintrag,
            daten.vorlesung
        )
    );


    if (
        typ === "eigen"
    ) {

        const vergleich =
            erzeugeVergleichsButton();


        if (
            vergleich
        ) {

            aktionen.appendChild(
                vergleich
            );
        }
    }


    kopfZeile.appendChild(
        aktionen
    );


    kopf.appendChild(
        kopfZeile
    );

    element.appendChild(
        kopf
    );


    const lektionen =
        Array.isArray(
            daten.lektionen
        )
        ?
        daten.lektionen
        :
        [];


    for (
        const lektion
        of lektionen
    ) {

        const lektionsElement =
            document.createElement("div");

        lektionsElement.className =
            "lektion";


        const titel =
            document.createElement("h3");

        titel.textContent =
            "Lektion "
            +
            lektion.lektion;


        lektionsElement.appendChild(
            titel
        );


        const versuche =
            Array.isArray(
                lektion.versuche
            )
            ?
            lektion.versuche
            :
            [];


        for (
            const versuch
            of versuche
        ) {

            lektionsElement.appendChild(
                erzeugeVersuch(
                    versuch,
                    eintrag,
                    daten
                )
            );
        }


        element.appendChild(
            lektionsElement
        );
    }


    return element;
}


/* =========================================================
   Kurzansicht
========================================================= */

function erzeugeKurzansicht(
    eintrag,
    typ
) {

    const element =
        document.createElement("div");

    element.className =
        "kurzansicht";


    if (
        typ === "vergleich"
    ) {

        element.classList.add(
            "vergleich"
        );
    }


    element.dataset.typ =
        typ;


    const info =
        document.createElement("div");

    info.className =
        "kurz-info";


    const titel =
        document.createElement("div");

    titel.className =
        "kurz-titel";

    titel.textContent =
        "Vorlesung "
        +
        (
            eintrag.vorlesungsnummer
            ??
            ""
        );


    const hinweis =
        document.createElement("span");

    hinweis.className =
        "serien-hinweis "
        +
        typ;


    hinweis.textContent =
        typ === "eigen"
        ?
        "Ihre Vorlesungsserie"
        :
        "Vergleichsserie";


    info.appendChild(
        titel
    );

    info.appendChild(
        hinweis
    );


    const aktionen =
        document.createElement("div");

    aktionen.className =
        "kurz-aktionen";


    const anzeigen =
        document.createElement("button");

    anzeigen.className =
        "aktion-button";

    anzeigen.textContent =
        "Vorlesung anzeigen";


    anzeigen.addEventListener(
        "click",
        async function() {

            anzeigen.disabled =
                true;

            anzeigen.textContent =
                "Wird geladen …";


            try {

                const daten =
                    await ladeVorlesungsDatei(
                        eintrag
                    );


                const voll =
                    erzeugeVorlesung(
                        eintrag,
                        daten,
                        typ,
                        false
                    );


                element.replaceWith(
                    voll
                );


                aktualisiereTagGrid(
                    voll.closest(".tag")
                );

            } catch (fehler) {

                anzeigen.disabled =
                    false;

                anzeigen.textContent =
                    "Erneut versuchen";
            }
        }
    );


    aktionen.appendChild(
        anzeigen
    );


    aktionen.appendChild(
        erzeugeVorlesungsMailbutton(
            eintrag,
            eintrag.vorlesungsnummer
        )
    );


    if (
        typ === "eigen"
    ) {

        const vergleich =
            erzeugeVergleichsButton();


        if (
            vergleich
        ) {

            aktionen.appendChild(
                vergleich
            );
        }
    }


    element.appendChild(
        info
    );

    element.appendChild(
        aktionen
    );


    return element;
}


/* =========================================================
   Tagesblock
========================================================= */

function erzeugeTag(
    datum
) {

    const tag =
        document.createElement("section");

    tag.className =
        "tag";

    tag.dataset.datum =
        datum;


    const datumTitel =
        document.createElement("div");

    datumTitel.className =
        "tag-datum";

    datumTitel.textContent =
        datum;


    const grid =
        document.createElement("div");

    grid.className =
        "tag-grid";


    tag.appendChild(
        datumTitel
    );

    tag.appendChild(
        grid
    );


    return tag;
}


/* =========================================================
   Grid aktualisieren
========================================================= */

function aktualisiereTagGrid(
    tag
) {

    if (!tag) {
        return;
    }


    const grid =
        tag.querySelector(
            ".tag-grid"
        );


    const eigen =
        grid.querySelector(
            '[data-typ="eigen"]'
        );


    const vergleich =
        grid.querySelector(
            '[data-typ="vergleich"]'
        );


    if (
        eigen
        &&
        vergleich
    ) {

        grid.classList.add(
            "zwei"
        );

    } else {

        grid.classList.remove(
            "zwei"
        );
    }
}


/* =========================================================
   Einträge gruppieren
========================================================= */

function gruppiereEintraege(
    eintraege
) {

    const map =
        new Map();


    for (
        const eintrag
        of eintraege
    ) {

        if (
            !map.has(
                eintrag.datum
            )
        ) {

            map.set(
                eintrag.datum,
                []
            );
        }


        map.get(
            eintrag.datum
        ).push(
            eintrag
        );
    }


    return map;
}


/* =========================================================
   Vergangenheit aufbauen
========================================================= */

function baueVergangenheit() {

    const container =
        document.getElementById(
            "vergangenheit"
        );


    container.innerHTML =
        "";


    const eintraege =
        vergangeneEigene.map(
            eintrag => ({
                ...eintrag,
                typ:
                    "eigen"
            })
        );


    if (
        vergleichAnzeigen
    ) {

        const heute =
            heuteOhneUhrzeit();


        const alteVergleich =
            vergleichsEintraege
                .filter(
                    eintrag =>
                        datumAusDeutsch(
                            eintrag.datum
                        )
                        <
                        heute
                )
                .map(
                    eintrag => ({
                        ...eintrag,
                        typ:
                            "vergleich"
                    })
                );


        eintraege.push(
            ...alteVergleich
        );
    }


    eintraege.sort(
        (a, b) =>
            datumAusDeutsch(
                a.datum
            )
            -
            datumAusDeutsch(
                b.datum
            )
    );


    const gruppiert =
        gruppiereEintraege(
            eintraege
        );


    for (
        const [
            datum,
            gruppe
        ]
        of gruppiert
    ) {

        const tag =
            erzeugeTag(
                datum
            );


        const grid =
            tag.querySelector(
                ".tag-grid"
            );


        for (
            const eintrag
            of gruppe
        ) {

            grid.appendChild(
                erzeugeKurzansicht(
                    eintrag,
                    eintrag.typ
                )
            );
        }


        container.appendChild(
            tag
        );


        aktualisiereTagGrid(
            tag
        );
    }
}


/* =========================================================
   Hauptansicht
========================================================= */

async function baueHauptansicht() {

    const container =
        document.getElementById(
            "inhalt"
        );


    container.innerHTML =
        "";


    const eintraege =
        [];


    for (
        const eintrag
        of zukunftEigene
    ) {

        eintraege.push({
            ...eintrag,
            typ:
                "eigen"
        });
    }


    if (
        vergleichAnzeigen
    ) {

        const heute =
            heuteOhneUhrzeit();


        const zukunftVergleich =
            vergleichsEintraege
                .filter(
                    eintrag =>
                        datumAusDeutsch(
                            eintrag.datum
                        )
                        >=
                        heute
                )
                .map(
                    eintrag => ({
                        ...eintrag,
                        typ:
                            "vergleich"
                    })
                );


        eintraege.push(
            ...zukunftVergleich
        );
    }


    eintraege.sort(
        (a, b) => {

            const differenz =
                datumAusDeutsch(
                    a.datum
                )
                -
                datumAusDeutsch(
                    b.datum
                );


            if (
                differenz !== 0
            ) {

                return differenz;
            }


            return (
                a.typ === "eigen"
                ? -1
                : 1
            );
        }
    );


    const gruppiert =
        gruppiereEintraege(
            eintraege
        );


    for (
        const [
            datum,
            gruppe
        ]
        of gruppiert
    ) {

        const tag =
            erzeugeTag(
                datum
            );


        const grid =
            tag.querySelector(
                ".tag-grid"
            );


        for (
            const eintrag
            of gruppe
        ) {

            const istNaechste =
                eintrag.typ === "eigen"
                &&
                naechsterEigenerEintrag
                &&
                eintrag.datei
                ===
                naechsterEigenerEintrag.datei;


            if (
                istNaechste
            ) {

                try {

                    const daten =
                        await ladeVorlesungsDatei(
                            eintrag
                        );


                    grid.appendChild(
                        erzeugeVorlesung(
                            eintrag,
                            daten,
                            "eigen",
                            true
                        )
                    );

                } catch (fehler) {

                    grid.appendChild(
                        erzeugeKurzansicht(
                            eintrag,
                            "eigen"
                        )
                    );
                }

            } else {

                grid.appendChild(
                    erzeugeKurzansicht(
                        eintrag,
                        eintrag.typ
                    )
                );
            }
        }


        container.appendChild(
            tag
        );


        aktualisiereTagGrid(
            tag
        );
    }
}


/* =========================================================
   Vergangenheit ein-/ausblenden

   Die früheren Vorlesungen werden nach oben aufgeklappt.
   Die aktuelle Vorlesung bleibt dabei optisch an derselben
   Stelle im Browserfenster.
========================================================= */

document
    .getElementById(
        "vergangenheitButton"
    )
    .addEventListener(
        "click",
        function() {

            const vergangenheit =
                document.getElementById(
                    "vergangenheit"
                );


            const button =
                document.getElementById(
                    "vergangenheitButton"
                );


            /*
                Aktuelle / erste sichtbare Vorlesung merken.
            */

            const ersteAktuelleVorlesung =
                document
                    .getElementById(
                        "inhalt"
                    )
                    .querySelector(
                        ".tag"
                    );


            let altePosition =
                null;


            if (
                ersteAktuelleVorlesung
            ) {

                altePosition =
                    ersteAktuelleVorlesung
                        .getBoundingClientRect()
                        .top;
            }


            vergangenheitSichtbar =
                !vergangenheitSichtbar;


            if (
                vergangenheitSichtbar
            ) {

                /*
                    Vergangene Vorlesungen erzeugen.
                */

                baueVergangenheit();


                vergangenheit
                    .classList
                    .add(
                        "aktiv"
                    );


                button.textContent =
                    "↓ Frühere Vorlesungen ausblenden";


            } else {

                vergangenheit
                    .classList
                    .remove(
                        "aktiv"
                    );


                button.textContent =
                    "↑ Frühere Vorlesungen anzeigen";
            }


            /*
                Nach dem Öffnen/Schliessen muss der Browser
                zuerst das neue Layout berechnen.
            */

            requestAnimationFrame(
                function() {

                    if (
                        !ersteAktuelleVorlesung
                        ||
                        altePosition === null
                    ) {

                        return;
                    }


                    const neuePosition =
                        ersteAktuelleVorlesung
                            .getBoundingClientRect()
                            .top;


                    /*
                        Differenz ausgleichen.

                        Dadurch bleibt die aktuelle Vorlesung
                        genau dort, wo sie vorher war.

                        Die Vergangenheit erscheint darüber.
                    */

                    window.scrollBy(
                        0,
                        neuePosition
                        -
                        altePosition
                    );
                }
            );
        }
    );

/* =========================================================
   Start
========================================================= */

async function starteSeite() {

    try {

        const antwort =
            await fetch(
                "index.json",
                {
                    cache:
                        "no-store"
                }
            );


        if (!antwort.ok) {

            throw new Error(
                "index.json konnte nicht geladen werden."
            );
        }


        indexDaten =
            await antwort.json();


        eigeneEintraege =
            indexDaten.vorlesungen
                .filter(
                    eintrag =>
                        Number(
                            eintrag.stammserie
                        )
                        ===
                        eigeneSerie
                )
                .sort(
                    (a, b) =>
                        datumAusDeutsch(
                            a.datum
                        )
                        -
                        datumAusDeutsch(
                            b.datum
                        )
                );


        if (
            eigeneEintraege.length === 0
        ) {

            throw new Error(
                "Für die Stammvorlesungsserie "
                +
                eigeneSerie
                +
                " wurden keine Vorlesungen gefunden."
            );
        }


        vergleichsSerie =
            bestimmeVergleichsSerie();


        const heute =
            heuteOhneUhrzeit();


        vergangeneEigene =
            eigeneEintraege.filter(
                eintrag =>
                    datumAusDeutsch(
                        eintrag.datum
                    )
                    <
                    heute
            );


        zukunftEigene =
            eigeneEintraege.filter(
                eintrag =>
                    datumAusDeutsch(
                        eintrag.datum
                    )
                    >=
                    heute
            );


        naechsterEigenerEintrag =
            zukunftEigene[0]
            ||
            null;


        /*
            Falls alle Vorlesungen vorbei sind:
            letzte Vorlesung als Einstieg verwenden.
        */

        if (
            !naechsterEigenerEintrag
        ) {

            naechsterEigenerEintrag =
                eigeneEintraege[
                    eigeneEintraege.length - 1
                ];


            zukunftEigene =
                [
                    naechsterEigenerEintrag
                ];
        }


        await baueHauptansicht();


        document
            .getElementById(
                "status"
            )
            .textContent =
                "Stammvorlesungsserie "
                +
                eigeneSerie;


        /*
            Falls gar keine Vergangenheit existiert,
            Button verstecken.
        */

        if (
            vergangeneEigene.length === 0
        ) {

            document
                .querySelector(
                    ".vergangenheit-steuerung"
                )
                .style.display =
                    "none";
        }

    } catch (fehler) {

        document
            .getElementById(
                "status"
            )
            .textContent =
                "Fehler";


        document
            .getElementById(
                "fehler"
            )
            .textContent =
                fehler.message;


        console.error(
            fehler
        );
    }
}


starteSeite();

</script>
