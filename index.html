<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vorlesungsplanung</title>

<style>

/* =========================================================
   Grundlayout
========================================================= */

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, sans-serif;
    max-width: 1500px;
    margin: 30px auto;
    padding: 0 20px;

    background: #f4f6f8;
    color: #222;
}


/*
    Während der Startpositionierung wird der eigentliche
    Seiteninhalt noch nicht gezeigt.

    Dadurch sieht man keinen Sprung von oben zur
    aktuellen Vorlesung.
*/

body.startet #seite {
    visibility: hidden;
}


h1 {
    margin-bottom: 8px;
}

#status {
    color: #666;
    margin-bottom: 22px;
}

#fehler {
    color: #b00020;
    white-space: pre-wrap;
    margin-bottom: 20px;
}


/* =========================================================
   Ladebildschirm beim Start
========================================================= */

#startLader {
    position: fixed;
    inset: 0;

    z-index: 20000;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #f4f6f8;

    transition:
        opacity 0.18s ease,
        visibility 0.18s ease;
}

#startLader.weg {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.start-lader-inhalt {
    text-align: center;
    color: #405d6f;
}

.start-lader-text {
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 14px;
}

.start-lader-punkte {
    display: flex;
    justify-content: center;
    gap: 7px;
}

.start-lader-punkt {
    width: 8px;
    height: 8px;

    border-radius: 50%;
    background: #405d6f;

    animation:
        ladePunkt 1s infinite ease-in-out;
}

.start-lader-punkt:nth-child(2) {
    animation-delay: 0.15s;
}

.start-lader-punkt:nth-child(3) {
    animation-delay: 0.30s;
}

@keyframes ladePunkt {

    0%,
    100% {
        opacity: 0.3;
        transform: translateY(0);
    }

    50% {
        opacity: 1;
        transform: translateY(-4px);
    }
}


/* =========================================================
   Tagesblöcke
========================================================= */

.tag {
    margin-bottom: 34px;
    scroll-margin-top: 20px;
}

.tag-datum {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 12px;
}

.tag-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 18px;
}

.tag-grid.zwei {
    grid-template-columns: 1fr 1fr;
}


/* =========================================================
   Vorlesungen
========================================================= */

.vorlesung {
    border-radius: 12px;
    background: white;
    overflow: hidden;

    border: 2px solid #b7c0c6;
}

.vorlesung.eigen {
    border-color: #405d6f;
}

.vorlesung.eigen .vorlesung-kopf {
    background: #edf3f6;
}

.vorlesung.vergleich {
    border-color: #b87932;
}

.vorlesung.vergleich .vorlesung-kopf {
    background: #fff4e7;
}

.vorlesung.vergangen {
    opacity: 0.82;
}

.vorlesung.naechste {
    box-shadow:
        0 0 0 4px
        rgba(64, 93, 111, 0.18);
}


/* =========================================================
   Vorlesungskopf
========================================================= */

.vorlesung-kopf {
    padding: 15px 18px;
    border-bottom: 1px solid #ddd;
}

.vorlesung-kopf-zeile {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 18px;
}

.vorlesung-titel {
    min-width: 0;
}

.vorlesung-kopf h2 {
    margin: 0 0 8px 0;
}

.vorlesung-aktionen {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 8px;
}


/* =========================================================
   Kennzeichnungen
========================================================= */

.serien-hinweis {
    display: inline-block;

    font-size: 12px;
    font-weight: bold;

    padding: 5px 8px;
    border-radius: 6px;
}

.serien-hinweis.eigen {
    color: #405d6f;
    background: #dfeaf0;
}

.serien-hinweis.vergleich {
    color: #925c20;
    background: #ffe4c4;
}

.naechste-marker {
    display: inline-block;

    margin-left: 8px;

    font-size: 12px;
    font-weight: bold;

    padding: 5px 8px;
    border-radius: 6px;

    background: #405d6f;
    color: white;
}


/* =========================================================
   Buttons
========================================================= */

.aktion-button,
.mail-button {
    display: inline-block;

    box-sizing: border-box;

    padding: 9px 12px;
    border-radius: 7px;

    background: white;

    text-decoration: none;

    font-family: inherit;
    font-size: 13px;
    font-weight: bold;

    cursor: pointer;
}

.aktion-button {
    border: 1px solid #405d6f;
    color: #405d6f;
}

.aktion-button:hover {
    background: #dfeaf0;
}

.aktion-button:disabled {
    opacity: 0.55;
    cursor: default;
}

.mail-button {
    border: 1px solid #70808a;
    color: #405d6f;
}

.mail-button:hover {
    background: #e7eef2;
}


/* =========================================================
   Vergangene Vorlesung – Kurzansicht
========================================================= */

.vergangen-kurz {
    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 20px;

    padding: 14px 18px;

    background: white;

    border: 1px solid #bfc7cc;
    border-radius: 9px;

    color: #5f6a71;
}

.vergangen-kurz.vergleich {
    border-color: #d0a36c;
    background: #fffaf4;
}

.vergangen-kurz-info {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.vergangen-kurz-titel {
    font-weight: bold;
    font-size: 16px;
}

.vergangen-kurz-aktionen {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}


/* =========================================================
   Ladeplatzhalter
========================================================= */

.lade-karte {
    padding: 18px;

    background: white;

    border: 1px solid #ccd2d6;
    border-radius: 10px;

    color: #777;
}


/* =========================================================
   Lektionen
========================================================= */

.lektion {
    margin: 14px;
    padding: 14px;

    background: #f5f6f7;
    border-radius: 8px;
}

.lektion h3 {
    margin-top: 0;
    margin-bottom: 12px;
}


/* =========================================================
   Versuch
========================================================= */

.versuch {
    margin: 8px 0;
    padding: 10px 12px;

    background: white;

    border: 1px solid #ddd;
    border-radius: 6px;

    cursor: pointer;
}

.versuch:hover {
    background: #f0f3f5;
}

.versuch.aktiv {
    border-color: #607d8b;
    background: #f1f5f7;
}

.versuch-kopf {
    display: grid;

    grid-template-columns:
        70px 1fr 24px;

    gap: 10px;
    align-items: center;
}

.reihenfolge {
    font-weight: bold;
    color: #405d6f;
}

.versuch-name {
    font-weight: 600;
}

.pfeil {
    text-align: right;
    color: #666;
}


/* =========================================================
   Versuchsdetails
========================================================= */

.versuch-detail {
    display: none;

    margin-top: 14px;
    padding-top: 14px;

    border-top: 1px solid #ddd;
}

.versuch.aktiv .versuch-detail {
    display: grid;

    grid-template-columns:
        minmax(180px, 34%) 1fr;

    gap: 18px;
}

.thumbnail-bereich {
    min-width: 0;
}

.versuch-thumbnail {
    width: 100%;
    max-width: 500px;
    max-height: 340px;

    object-fit: contain;

    display: block;

    background: white;

    border: 1px solid #ddd;
    border-radius: 8px;

    cursor: zoom-in;
}

.versuch-thumbnail:hover {
    opacity: 0.9;
}

.bild-hinweis {
    margin-top: 7px;

    font-size: 12px;
    color: #777;
}

.versuch-text {
    line-height: 1.5;
    white-space: pre-wrap;
}

.versuch-mail {
    margin-top: 18px;
}

.kein-bild {
    color: #777;
    font-style: italic;
}


/* =========================================================
   Lightbox
========================================================= */

#lightbox {
    display: none;

    position: fixed;
    inset: 0;

    z-index: 10000;

    background:
        rgba(0, 0, 0, 0.88);

    align-items: center;
    justify-content: center;

    padding: 30px;

    box-sizing: border-box;
}

#lightbox.aktiv {
    display: flex;
}

#lightboxBild {
    max-width: 95vw;
    max-height: 92vh;

    object-fit: contain;

    background: white;

    box-shadow:
        0 0 25px
        rgba(0, 0, 0, 0.5);
}

#lightboxSchliessen {
    position: fixed;

    top: 15px;
    right: 22px;

    border: 0;

    background: transparent;
    color: white;

    font-size: 38px;

    cursor: pointer;
}


/* =========================================================
   Mobil
========================================================= */

@media (max-width: 950px) {

    .tag-grid.zwei {
        grid-template-columns: 1fr;
    }

    .versuch.aktiv .versuch-detail {
        grid-template-columns: 1fr;
    }

    .vorlesung-kopf-zeile,
    .vergangen-kurz {
        flex-direction: column;
        align-items: stretch;
    }

    .vorlesung-aktionen,
    .vergangen-kurz-aktionen {
        justify-content: flex-start;
    }
}

</style>

</head>


<body class="startet">


<!-- ======================================================
     Start-Ladebildschirm
======================================================= -->

<div id="startLader">

    <div class="start-lader-inhalt">

        <div class="start-lader-text">
            Vorlesungsplanung wird geladen …
        </div>

        <div class="start-lader-punkte">
            <span class="start-lader-punkt"></span>
            <span class="start-lader-punkt"></span>
            <span class="start-lader-punkt"></span>
        </div>

    </div>

</div>


<!-- ======================================================
     Eigentliche Seite
======================================================= -->

<div id="seite">

    <h1>
        Vorlesungsplanung
    </h1>

    <div id="status">
        Vorlesungsplanung wird geladen …
    </div>

    <div id="fehler"></div>

    <div id="inhalt"></div>

</div>


<!-- ======================================================
     Lightbox
======================================================= -->

<div id="lightbox">

    <button
        id="lightboxSchliessen"
        aria-label="Bild schliessen">
        ×
    </button>

    <img
        id="lightboxBild"
        src=""
        alt="Versuchsbild">

</div>


<script>


/* =========================================================
   KONFIGURATION
========================================================= */

const MAIL_ADRESSE =
    "pi-demo.space@unibe.ch";


/*
    ========================================================
    TESTMODUS
    ========================================================

    Aktuell simulieren wir:

    Stammvorlesungsserie 2
    Datum 09.05.2026

    PRODUKTIV später:

    const TEST_SERIE = null;
    const TEST_DATUM = null;
*/

const TEST_SERIE =
    2;


const TEST_DATUM =
    new Date(
        2026,
        4,
        9
    );


/* =========================================================
   Globale Daten
========================================================= */

let indexDaten =
    null;


let eigeneSerie =
    null;


let vergleichsSerie =
    null;


let vergleichAnzeigen =
    false;


let eigeneEintraege =
    [];


let vergleichsEintraege =
    [];


let naechsterEigenerEintrag =
    null;


/*
    Bereits geladene Vorlesungsdateien
    werden im Arbeitsspeicher gespeichert.
*/

const datenCache =
    new Map();


/* =========================================================
   Stammserie bestimmen
========================================================= */

const urlParameter =
    new URLSearchParams(
        window.location.search
    );


if (
    TEST_SERIE !== null
) {

    eigeneSerie =
        TEST_SERIE;

} else {

    eigeneSerie =
        Number(
            urlParameter.get(
                "serie"
            )
        );
}


/* =========================================================
   Datum
========================================================= */

function datumAusDeutsch(
    text
) {

    if (
        !text
    ) {

        return null;
    }


    const teile =
        text.split(".");


    if (
        teile.length !== 3
    ) {

        return null;
    }


    return new Date(
        Number(
            teile[2]
        ),
        Number(
            teile[1]
        ) - 1,
        Number(
            teile[0]
        )
    );
}


function heuteOhneUhrzeit() {

    if (
        TEST_DATUM !== null
    ) {

        return new Date(
            TEST_DATUM.getFullYear(),
            TEST_DATUM.getMonth(),
            TEST_DATUM.getDate()
        );
    }


    const jetzt =
        new Date();


    return new Date(
        jetzt.getFullYear(),
        jetzt.getMonth(),
        jetzt.getDate()
    );
}


/* =========================================================
   Mail
========================================================= */

function mailLink(
    betreff,
    text = ""
) {

    return (
        "mailto:"
        +
        MAIL_ADRESSE
        +
        "?subject="
        +
        encodeURIComponent(
            betreff
        )
        +
        "&body="
        +
        encodeURIComponent(
            text
        )
    );
}


/* =========================================================
   Startbildschirm beenden
========================================================= */

function zeigeSeite() {

    document
        .body
        .classList
        .remove(
            "startet"
        );


    document
        .getElementById(
            "startLader"
        )
        .classList
        .add(
            "weg"
        );
}


/* =========================================================
   Unsichtbar zur aktuellen Vorlesung positionieren
========================================================= */

function positioniereBeiAktuellerVorlesung(
    karte
) {

    return new Promise(
        function(resolve) {

            /*
                Erster Frame:
                Browser berechnet das Layout.
            */

            requestAnimationFrame(
                function() {

                    /*
                        Zweiter Frame:
                        Position ist jetzt stabiler.
                    */

                    requestAnimationFrame(
                        function() {

                            const position =
                                karte
                                    .getBoundingClientRect()
                                    .top
                                +
                                window.scrollY
                                -
                                20;


                            /*
                                bewusst KEINE Animation.

                                Der Benutzer sieht die Seite
                                zu diesem Zeitpunkt noch nicht.
                            */

                            window.scrollTo(
                                0,
                                Math.max(
                                    0,
                                    position
                                )
                            );


                            /*
                                Noch einen Frame warten,
                                damit der Browser die neue
                                Scrollposition übernehmen kann.
                            */

                            requestAnimationFrame(
                                function() {

                                    resolve();
                                }
                            );
                        }
                    );
                }
            );
        }
    );
}


/* =========================================================
   Vorlesungsdatei laden
========================================================= */

async function ladeVorlesungsDatei(
    eintrag
) {

    if (
        datenCache.has(
            eintrag.datei
        )
    ) {

        return datenCache.get(
            eintrag.datei
        );
    }


    /*
        Vorlesungsdateien dürfen
        vom Browser gecacht werden.
    */

    const antwort =
        await fetch(
            eintrag.datei
        );


    if (
        !antwort.ok
    ) {

        throw new Error(
            "Vorlesungsdatei konnte nicht geladen werden: "
            +
            eintrag.datei
        );
    }


    const daten =
        await antwort.json();


    datenCache.set(
        eintrag.datei,
        daten
    );


    return daten;
}


/* =========================================================
   Vergleichsserie bestimmen
========================================================= */

function bestimmeVergleichsSerie() {

    for (
        const eintrag
        of eigeneEintraege
    ) {

        if (
            eintrag.vergleichsserie
                !== undefined
            &&
            eintrag.vergleichsserie
                !== null
            &&
            Number(
                eintrag.vergleichsserie
            ) !== 0
        ) {

            return Number(
                eintrag.vergleichsserie
            );
        }
    }


    return null;
}


/* =========================================================
   Lightbox
========================================================= */

function oeffneLightbox(
    bildPfad,
    altText
) {

    if (
        !bildPfad
    ) {

        return;
    }


    const lightbox =
        document.getElementById(
            "lightbox"
        );


    const bild =
        document.getElementById(
            "lightboxBild"
        );


    /*
        Das grosse Bild wird erst jetzt geladen.
    */

    bild.src =
        bildPfad;


    bild.alt =
        altText
        ||
        "";


    lightbox
        .classList
        .add(
            "aktiv"
        );


    document.body.style.overflow =
        "hidden";
}


function schliesseLightbox() {

    document
        .getElementById(
            "lightbox"
        )
        .classList
        .remove(
            "aktiv"
        );


    document
        .getElementById(
            "lightboxBild"
        )
        .src =
            "";


    document.body.style.overflow =
        "";
}


document
    .getElementById(
        "lightboxSchliessen"
    )
    .addEventListener(
        "click",
        schliesseLightbox
    );


document
    .getElementById(
        "lightbox"
    )
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target.id
                ===
                "lightbox"
            ) {

                schliesseLightbox();
            }
        }
    );


document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Escape"
        ) {

            schliesseLightbox();
        }
    }
);


/* =========================================================
   Versuch
========================================================= */

function erzeugeVersuch(
    versuch,
    eintrag,
    vorlesungsDaten
) {

    const element =
        document.createElement(
            "div"
        );


    element.className =
        "versuch";


    /* -----------------------------------------------------
       Kopf
    ----------------------------------------------------- */

    const kopf =
        document.createElement(
            "div"
        );


    kopf.className =
        "versuch-kopf";


    const reihenfolge =
        document.createElement(
            "div"
        );


    reihenfolge.className =
        "reihenfolge";


    reihenfolge.textContent =
        versuch.reihenfolge
        ||
        "";


    const name =
        document.createElement(
            "div"
        );


    name.className =
        "versuch-name";


    name.textContent =
        versuch.versuch
        ||
        "";


    const pfeil =
        document.createElement(
            "div"
        );


    pfeil.className =
        "pfeil";


    pfeil.textContent =
        "▾";


    kopf.appendChild(
        reihenfolge
    );


    kopf.appendChild(
        name
    );


    kopf.appendChild(
        pfeil
    );


    /* -----------------------------------------------------
       Details
    ----------------------------------------------------- */

    const detail =
        document.createElement(
            "div"
        );


    detail.className =
        "versuch-detail";


    /* -----------------------------------------------------
       Bildbereich
    ----------------------------------------------------- */

    const bildBereich =
        document.createElement(
            "div"
        );


    bildBereich.className =
        "thumbnail-bereich";


    if (
        Number(
            versuch.bild_vorhanden
        ) === 1
        &&
        versuch.bild
    ) {

        const thumbnail =
            document.createElement(
                "img"
            );


        thumbnail.className =
            "versuch-thumbnail";


        thumbnail.src =
            versuch.thumbnail
            ||
            versuch.bild;


        thumbnail.loading =
            "lazy";


        thumbnail.decoding =
            "async";


        thumbnail.alt =
            versuch.versuch
            ||
            "Versuchsbild";


        thumbnail.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();


                oeffneLightbox(
                    versuch.bild,
                    versuch.versuch
                );
            }
        );


        bildBereich.appendChild(
            thumbnail
        );


        const hinweis =
            document.createElement(
                "div"
            );


        hinweis.className =
            "bild-hinweis";


        hinweis.textContent =
            "Bild anklicken für grosse Ansicht";


        bildBereich.appendChild(
            hinweis
        );

    } else {

        const keinBild =
            document.createElement(
                "div"
            );


        keinBild.className =
            "kein-bild";


        keinBild.textContent =
            "Kein Bild vorhanden.";


        bildBereich.appendChild(
            keinBild
        );
    }


    /* -----------------------------------------------------
       Beschreibung
    ----------------------------------------------------- */

    const textBereich =
        document.createElement(
            "div"
        );


    const text =
        document.createElement(
            "div"
        );


    text.className =
        "versuch-text";


    text.textContent =
        versuch.text
        ||
        "Keine Beschreibung vorhanden.";


    textBereich.appendChild(
        text
    );


    /* -----------------------------------------------------
       Mail zum Versuch
    ----------------------------------------------------- */

    const mailBereich =
        document.createElement(
            "div"
        );


    mailBereich.className =
        "versuch-mail";


    const frageButton =
        document.createElement(
            "a"
        );


    frageButton.className =
        "mail-button";


    frageButton.textContent =
        "✉ Frage zum Versuch";


    frageButton.href =
        mailLink(

            "Frage zum Versuch: "
            +
            (
                versuch.versuch
                ||
                ""
            ),

            "Ich habe eine Frage zum Versuch „"
            +
            (
                versuch.versuch
                ||
                ""
            )
            +
            "“.\n\n"
            +
            "Vorlesung: "
            +
            vorlesungsDaten.vorlesung
            +
            "\n"
            +
            "Datum: "
            +
            eintrag.datum
            +
            "\n\n"
        );


    frageButton.addEventListener(
        "click",
        function(event) {

            event.stopPropagation();
        }
    );


    mailBereich.appendChild(
        frageButton
    );


    textBereich.appendChild(
        mailBereich
    );


    detail.appendChild(
        bildBereich
    );


    detail.appendChild(
        textBereich
    );


    element.appendChild(
        kopf
    );


    element.appendChild(
        detail
    );


    /* -----------------------------------------------------
       Versuch öffnen / schliessen
    ----------------------------------------------------- */

    element.addEventListener(
        "click",
        function() {

            const aktiv =
                element
                    .classList
                    .toggle(
                        "aktiv"
                    );


            pfeil.textContent =
                aktiv
                ?
                "▴"
                :
                "▾";
        }
    );


    return element;
}

/* =========================================================
   Vergleich umschalten
========================================================= */

async function vergleichUmschalten() {

    vergleichAnzeigen =
        !vergleichAnzeigen;


    document
        .getElementById(
            "status"
        )
        .textContent =
            vergleichAnzeigen
            ?
            "Vergleich wird geladen …"
            :
            "Vergleich wird ausgeblendet …";


    if (
        vergleichAnzeigen
        &&
        vergleichsSerie !== null
    ) {

        vergleichsEintraege =
            indexDaten.vorlesungen
                .filter(
                    eintrag =>
                        Number(
                            eintrag.stammserie
                        )
                        ===
                        vergleichsSerie
                )
                .sort(
                    (a, b) =>
                        datumAusDeutsch(
                            a.datum
                        )
                        -
                        datumAusDeutsch(
                            b.datum
                        )
                );
    }


    /*
        Beim Vergleich bewusst nicht wieder
        automatisch scrollen.

        Der Benutzer bleibt ungefähr an
        seiner aktuellen Stelle.
    */

    await baueAnsicht(
        false
    );


    document
        .getElementById(
            "status"
        )
        .textContent =
            "Stammvorlesungsserie "
            +
            eigeneSerie;
}


/* =========================================================
   Vergleichsbutton
========================================================= */

function erzeugeVergleichsButton() {

    if (
        vergleichsSerie === null
    ) {

        return null;
    }


    const button =
        document.createElement(
            "button"
        );


    button.className =
        "aktion-button";


    button.textContent =
        vergleichAnzeigen
        ?
        "Vergleich ausblenden"
        :
        "Vergleich einblenden";


    button.addEventListener(
        "click",
        function(event) {

            event.stopPropagation();


            vergleichUmschalten();
        }
    );


    return button;
}


/* =========================================================
   Vollständige Vorlesung
========================================================= */

function erzeugeVorlesung(
    eintrag,
    daten,
    typ,
    istNaechste
) {

    const heute =
        heuteOhneUhrzeit();


    const element =
        document.createElement(
            "article"
        );


    element.className =
        "vorlesung "
        +
        typ;


    element.dataset.typ =
        typ;


    if (
        datumAusDeutsch(
            eintrag.datum
        )
        <
        heute
    ) {

        element.classList.add(
            "vergangen"
        );
    }


    if (
        istNaechste
    ) {

        element.classList.add(
            "naechste"
        );


        element.dataset.aktuell =
            "1";
    }


    /* -----------------------------------------------------
       Kopf
    ----------------------------------------------------- */

    const kopf =
        document.createElement(
            "div"
        );


    kopf.className =
        "vorlesung-kopf";


    const kopfZeile =
        document.createElement(
            "div"
        );


    kopfZeile.className =
        "vorlesung-kopf-zeile";


    const titelBereich =
        document.createElement(
            "div"
        );


    titelBereich.className =
        "vorlesung-titel";


    const titel =
        document.createElement(
            "h2"
        );


    titel.textContent =
        "Vorlesung "
        +
        daten.vorlesung;


    const hinweis =
        document.createElement(
            "span"
        );


    hinweis.className =
        "serien-hinweis "
        +
        typ;


    hinweis.textContent =
        typ ===
        "eigen"
        ?
        "Ihre Vorlesungsserie"
        :
        "Vergleichsserie";


    titelBereich.appendChild(
        titel
    );


    titelBereich.appendChild(
        hinweis
    );


    if (
        istNaechste
    ) {

        const marker =
            document.createElement(
                "span"
            );


        marker.className =
            "naechste-marker";


        marker.textContent =
            "NÄCHSTE VORLESUNG";


        titelBereich.appendChild(
            marker
        );
    }


    kopfZeile.appendChild(
        titelBereich
    );


    /* -----------------------------------------------------
       Aktionen
    ----------------------------------------------------- */

    const aktionen =
        document.createElement(
            "div"
        );


    aktionen.className =
        "vorlesung-aktionen";


    aktionen.appendChild(

        erzeugeVorlesungsMailbutton(
            eintrag,
            daten.vorlesung
        )

    );


    if (
        typ ===
        "eigen"
    ) {

        const vergleichButton =
            erzeugeVergleichsButton();


        if (
            vergleichButton
        ) {

            aktionen.appendChild(
                vergleichButton
            );
        }
    }


    kopfZeile.appendChild(
        aktionen
    );


    kopf.appendChild(
        kopfZeile
    );


    element.appendChild(
        kopf
    );


    /* -----------------------------------------------------
       Lektionen
    ----------------------------------------------------- */

    const lektionen =
        Array.isArray(
            daten.lektionen
        )
        ?
        daten.lektionen
        :
        [];


    for (
        const lektion
        of lektionen
    ) {

        const lektionsElement =
            document.createElement(
                "div"
            );


        lektionsElement.className =
            "lektion";


        const lektionTitel =
            document.createElement(
                "h3"
            );


        lektionTitel.textContent =
            "Lektion "
            +
            lektion.lektion;


        lektionsElement.appendChild(
            lektionTitel
        );


        const versuche =
            Array.isArray(
                lektion.versuche
            )
            ?
            lektion.versuche
            :
            [];


        for (
            const versuch
            of versuche
        ) {

            lektionsElement.appendChild(

                erzeugeVersuch(
                    versuch,
                    eintrag,
                    daten
                )

            );
        }


        element.appendChild(
            lektionsElement
        );
    }


    return element;
}


/* =========================================================
   Vergangene Vorlesung kompakt
========================================================= */

function erzeugeVergangeneKurzansicht(
    eintrag,
    typ
) {

    const element =
        document.createElement(
            "div"
        );


    element.className =
        "vergangen-kurz";


    element.dataset.typ =
        typ;


    if (
        typ ===
        "vergleich"
    ) {

        element.classList.add(
            "vergleich"
        );
    }


    const info =
        document.createElement(
            "div"
        );


    info.className =
        "vergangen-kurz-info";


    const titel =
        document.createElement(
            "div"
        );


    titel.className =
        "vergangen-kurz-titel";


    titel.textContent =
        "Vorlesung "
        +
        (
            eintrag.vorlesungsnummer
            ??
            ""
        );


    const serie =
        document.createElement(
            "span"
        );


    serie.className =
        "serien-hinweis "
        +
        typ;


    serie.textContent =
        typ ===
        "eigen"
        ?
        "Ihre Vorlesungsserie"
        :
        "Vergleichsserie";


    info.appendChild(
        titel
    );


    info.appendChild(
        serie
    );


    const aktionen =
        document.createElement(
            "div"
        );


    aktionen.className =
        "vergangen-kurz-aktionen";


    /* -----------------------------------------------------
       Vorlesung anzeigen
    ----------------------------------------------------- */

    const anzeigen =
        document.createElement(
            "button"
        );


    anzeigen.className =
        "aktion-button";


    anzeigen.textContent =
        "Vorlesung anzeigen";


    anzeigen.addEventListener(
        "click",
        async function(event) {

            event.stopPropagation();


            anzeigen.disabled =
                true;


            anzeigen.textContent =
                "Wird geladen …";


            try {

                const daten =
                    await ladeVorlesungsDatei(
                        eintrag
                    );


                const voll =
                    erzeugeVorlesung(
                        eintrag,
                        daten,
                        typ,
                        false
                    );


                /*
                    Der volle Block übernimmt
                    die Rolle dieser Karte.
                */

                element.replaceWith(
                    voll
                );


                aktualisiereTagGrid(
                    voll.closest(
                        ".tag"
                    )
                );

            } catch (fehler) {

                anzeigen.disabled =
                    false;


                anzeigen.textContent =
                    "Erneut versuchen";


                console.error(
                    fehler
                );
            }
        }
    );


    aktionen.appendChild(
        anzeigen
    );


    /* -----------------------------------------------------
       Mail
    ----------------------------------------------------- */

    aktionen.appendChild(

        erzeugeVorlesungsMailbutton(
            eintrag,
            eintrag.vorlesungsnummer
        )

    );


    /* -----------------------------------------------------
       Vergleich
    ----------------------------------------------------- */

    if (
        typ ===
        "eigen"
    ) {

        const vergleichButton =
            erzeugeVergleichsButton();


        if (
            vergleichButton
        ) {

            aktionen.appendChild(
                vergleichButton
            );
        }
    }


    element.appendChild(
        info
    );


    element.appendChild(
        aktionen
    );


    return element;
}


/* =========================================================
   Tagesblock erzeugen
========================================================= */

function holeOderErzeugeTag(
    datumText
) {

    const container =
        document.getElementById(
            "inhalt"
        );


    let tag =
        container.querySelector(
            '[data-datum="'
            +
            datumText
            +
            '"]'
        );


    if (
        tag
    ) {

        return tag;
    }


    tag =
        document.createElement(
            "section"
        );


    tag.className =
        "tag";


    tag.dataset.datum =
        datumText;


    const datumTitel =
        document.createElement(
            "div"
        );


    datumTitel.className =
        "tag-datum";


    datumTitel.textContent =
        datumText;


    const grid =
        document.createElement(
            "div"
        );


    grid.className =
        "tag-grid";


    tag.appendChild(
        datumTitel
    );


    tag.appendChild(
        grid
    );


    /* -----------------------------------------------------
       Chronologisch einsortieren
    ----------------------------------------------------- */

    const vorhandeneTage =
        Array.from(
            container.querySelectorAll(
                ".tag"
            )
        );


    const datumNeu =
        datumAusDeutsch(
            datumText
        );


    let eingefuegt =
        false;


    for (
        const vorhandenerTag
        of vorhandeneTage
    ) {

        const datumVorhanden =
            datumAusDeutsch(
                vorhandenerTag.dataset.datum
            );


        if (
            datumNeu
            <
            datumVorhanden
        ) {

            container.insertBefore(
                tag,
                vorhandenerTag
            );


            eingefuegt =
                true;


            break;
        }
    }


    if (
        !eingefuegt
    ) {

        container.appendChild(
            tag
        );
    }


    return tag;
}


/* =========================================================
   Tages-Grid aktualisieren
========================================================= */

function aktualisiereTagGrid(
    tag
) {

    if (
        !tag
    ) {

        return;
    }


    const grid =
        tag.querySelector(
            ".tag-grid"
        );


    if (
        !grid
    ) {

        return;
    }


    const hatEigen =
        grid.querySelector(
            '[data-typ="eigen"]'
        );


    const hatVergleich =
        grid.querySelector(
            '[data-typ="vergleich"]'
        );


    if (
        hatEigen
        &&
        hatVergleich
    ) {

        grid.classList.add(
            "zwei"
        );

    } else {

        grid.classList.remove(
            "zwei"
        );
    }
}


/* =========================================================
   Karte in Tagesblock einsetzen
========================================================= */

function fuegeKarteEin(
    eintrag,
    typ,
    karte
) {

    const tag =
        holeOderErzeugeTag(
            eintrag.datum
        );


    const grid =
        tag.querySelector(
            ".tag-grid"
        );


    karte.dataset.typ =
        typ;


    /*
        Eigene Serie links,
        Vergleich rechts.
    */

    if (
        typ ===
        "eigen"
    ) {

        const vergleich =
            grid.querySelector(
                '[data-typ="vergleich"]'
            );


        if (
            vergleich
        ) {

            grid.insertBefore(
                karte,
                vergleich
            );

        } else {

            grid.appendChild(
                karte
            );
        }

    } else {

        grid.appendChild(
            karte
        );
    }


    aktualisiereTagGrid(
        tag
    );
}


/* =========================================================
   Volle Karte laden
========================================================= */

async function ladeVolleKarte(
    eintrag,
    typ,
    istNaechste
) {

    const daten =
        await ladeVorlesungsDatei(
            eintrag
        );


    return erzeugeVorlesung(
        eintrag,
        daten,
        typ,
        istNaechste
    );
}


/* =========================================================
   Ansicht aufbauen
========================================================= */

async function baueAnsicht(
    beimStartPositionieren = false
) {

    const container =
        document.getElementById(
            "inhalt"
        );


    /*
        Wenn die Ansicht während der Benutzung
        neu aufgebaut wird, merken wir uns die
        aktuelle Bildschirmposition.

        Das ist insbesondere für
        Vergleich ein-/ausblenden wichtig.
    */

    const alteScrollPosition =
        window.scrollY;


    container.innerHTML =
        "";


    const heute =
        heuteOhneUhrzeit();


    /* =====================================================
       1. VERGANGENE EIGENE VORLESUNGEN

       Nur kompakte Karten.

       Keine Vorlesungs-JSON laden.
    ===================================================== */

    const vergangeneEigene =
        eigeneEintraege.filter(
            eintrag =>
                datumAusDeutsch(
                    eintrag.datum
                )
                <
                heute
        );


    for (
        const eintrag
        of vergangeneEigene
    ) {

        const kurz =
            erzeugeVergangeneKurzansicht(
                eintrag,
                "eigen"
            );


        fuegeKarteEin(
            eintrag,
            "eigen",
            kurz
        );
    }


    /* =====================================================
       2. VERGANGENE VERGLEICHSVORLESUNGEN

       Ebenfalls nur kompakt.
    ===================================================== */

    if (
        vergleichAnzeigen
    ) {

        const vergangeneVergleich =
            vergleichsEintraege.filter(
                eintrag =>
                    datumAusDeutsch(
                        eintrag.datum
                    )
                    <
                    heute
            );


        for (
            const eintrag
            of vergangeneVergleich
        ) {

            const kurz =
                erzeugeVergangeneKurzansicht(
                    eintrag,
                    "vergleich"
                );


            fuegeKarteEin(
                eintrag,
                "vergleich",
                kurz
            );
        }
    }


    /* =====================================================
       3. NÄCHSTE EIGENE VORLESUNG

       Als erste vollständige JSON-Datei laden.
    ===================================================== */

    let aktuelleKarte =
        null;


    if (
        naechsterEigenerEintrag
    ) {

        aktuelleKarte =
            await ladeVolleKarte(
                naechsterEigenerEintrag,
                "eigen",
                true
            );


        fuegeKarteEin(
            naechsterEigenerEintrag,
            "eigen",
            aktuelleKarte
        );
    }


    /* =====================================================
       4. RESTLICHE ZUKUNFT

       Zunächst nur Platzhalter.

       Damit existieren die Tagesblöcke sofort,
       die eigentlichen JSON-Dateien kommen
       anschließend.
    ===================================================== */

    const zukunftEigene =
        eigeneEintraege.filter(

            eintrag => {

                const datum =
                    datumAusDeutsch(
                        eintrag.datum
                    );


                if (
                    datum
                    <
                    heute
                ) {

                    return false;
                }


                if (
                    naechsterEigenerEintrag
                    &&
                    eintrag.datei
                    ===
                    naechsterEigenerEintrag.datei
                ) {

                    return false;
                }


                return true;
            }
        );


    const eigenePlatzhalter =
        [];


    for (
        const eintrag
        of zukunftEigene
    ) {

        const platzhalter =
            document.createElement(
                "div"
            );


        platzhalter.className =
            "lade-karte";


        platzhalter.textContent =
            "Vorlesung "
            +
            eintrag.vorlesungsnummer
            +
            " wird geladen …";


        fuegeKarteEin(
            eintrag,
            "eigen",
            platzhalter
        );


        eigenePlatzhalter.push({
            eintrag:
                eintrag,

            platzhalter:
                platzhalter
        });
    }


    /* =====================================================
       5. Vergleichsserie – Zukunft

       Erst wenn der Vergleich eingeschaltet ist.
    ===================================================== */

    const vergleichPlatzhalter =
        [];


    if (
        vergleichAnzeigen
    ) {

        const zukunftVergleich =
            vergleichsEintraege.filter(
                eintrag =>
                    datumAusDeutsch(
                        eintrag.datum
                    )
                    >=
                    heute
            );


        for (
            const eintrag
            of zukunftVergleich
        ) {

            const platzhalter =
                document.createElement(
                    "div"
                );


            platzhalter.className =
                "lade-karte";


            platzhalter.textContent =
                "Vergleichsvorlesung "
                +
                eintrag.vorlesungsnummer
                +
                " wird geladen …";


            fuegeKarteEin(
                eintrag,
                "vergleich",
                platzhalter
            );


            vergleichPlatzhalter.push({
                eintrag:
                    eintrag,

                platzhalter:
                    platzhalter
            });
        }
    }


    /* =====================================================
       6. STARTPOSITION

       Das ist der neue wichtige Teil.

       Beim allerersten Seitenstart ist die Seite
       noch verborgen.

       Jetzt positionieren wir den Browser exakt
       bei der nächsten Vorlesung.

       Erst DANACH wird die Seite sichtbar.
    ===================================================== */

    if (
        beimStartPositionieren
        &&
        aktuelleKarte
    ) {

        await positioniereBeiAktuellerVorlesung(
            aktuelleKarte
        );


        zeigeSeite();

    } else {

        /*
            Bei späterem Neuaufbau, z.B. Vergleich,
            nicht automatisch wieder zur aktuellen
            Vorlesung springen.
        */

        requestAnimationFrame(
            function() {

                window.scrollTo(
                    0,
                    alteScrollPosition
                );
            }
        );
    }


    document
        .getElementById(
            "status"
        )
        .textContent =
            "Stammvorlesungsserie "
            +
            eigeneSerie;


    /* =====================================================
       7. RESTLICHE EIGENE VORLESUNGEN

       Erst nachdem die Seite bereits sichtbar ist.
    ===================================================== */

    for (
        const objekt
        of eigenePlatzhalter
    ) {

        try {

            const karte =
                await ladeVolleKarte(
                    objekt.eintrag,
                    "eigen",
                    false
                );


            /*
                data-typ bleibt wichtig für
                das Zwei-Spalten-Layout.
            */

            karte.dataset.typ =
                "eigen";


            objekt
                .platzhalter
                .replaceWith(
                    karte
                );


            aktualisiereTagGrid(
                karte.closest(
                    ".tag"
                )
            );

        } catch (fehler) {

            objekt
                .platzhalter
                .textContent =
                    "Vorlesung konnte nicht geladen werden.";


            console.error(
                fehler
            );
        }


        /*
            Browser Zeit zum Rendern geben.
        */

        await new Promise(
            resolve =>
                requestAnimationFrame(
                    resolve
                )
        );
    }


    /* =====================================================
       8. Vergleich im Hintergrund
    ===================================================== */

    for (
        const objekt
        of vergleichPlatzhalter
    ) {

        try {

            const karte =
                await ladeVolleKarte(
                    objekt.eintrag,
                    "vergleich",
                    false
                );


            karte.dataset.typ =
                "vergleich";


            objekt
                .platzhalter
                .replaceWith(
                    karte
                );


            aktualisiereTagGrid(
                karte.closest(
                    ".tag"
                )
            );

        } catch (fehler) {

            objekt
                .platzhalter
                .textContent =
                    "Vergleichsvorlesung konnte nicht geladen werden.";


            console.error(
                fehler
            );
        }


        await new Promise(
            resolve =>
                requestAnimationFrame(
                    resolve
                )
        );
    }
}


/* =========================================================
   Start
========================================================= */

async function starteSeite() {

    try {

        if (
            !eigeneSerie
            ||
            Number.isNaN(
                eigeneSerie
            )
        ) {

            throw new Error(
                "Keine gültige Stammvorlesungsserie angegeben."
            );
        }


        /* -------------------------------------------------
           index.json immer frisch laden
        ------------------------------------------------- */

        const antwort =
            await fetch(
                "index.json",
                {
                    cache:
                        "no-store"
                }
            );


        if (
            !antwort.ok
        ) {

            throw new Error(
                "index.json konnte nicht geladen werden."
            );
        }


        indexDaten =
            await antwort.json();


        if (
            !indexDaten
            ||
            !Array.isArray(
                indexDaten.vorlesungen
            )
        ) {

            throw new Error(
                "index.json enthält keine gültige Vorlesungsliste."
            );
        }


        /* -------------------------------------------------
           Eigene Serie
        ------------------------------------------------- */

        eigeneEintraege =
            indexDaten.vorlesungen
                .filter(
                    eintrag =>
                        Number(
                            eintrag.stammserie
                        )
                        ===
                        eigeneSerie
                )
                .sort(
                    (a, b) =>
                        datumAusDeutsch(
                            a.datum
                        )
                        -
                        datumAusDeutsch(
                            b.datum
                        )
                );


        if (
            eigeneEintraege.length
            === 0
        ) {

            throw new Error(
                "Für die Stammvorlesungsserie "
                +
                eigeneSerie
                +
                " wurden keine Vorlesungen gefunden."
            );
        }


        /* -------------------------------------------------
           Vergleich
        ------------------------------------------------- */

        vergleichsSerie =
            bestimmeVergleichsSerie();


        /* -------------------------------------------------
           Nächste eigene Vorlesung
        ------------------------------------------------- */

        const heute =
            heuteOhneUhrzeit();


        naechsterEigenerEintrag =
            eigeneEintraege.find(

                eintrag =>
                    datumAusDeutsch(
                        eintrag.datum
                    )
                    >=
                    heute
            )
            ||
            null;


        /*
            Falls sämtliche Vorlesungen bereits
            vergangen sind, verwenden wir die letzte.

            Sie dient dann als sinnvollster Einstieg.
        */

        if (
            !naechsterEigenerEintrag
        ) {

            naechsterEigenerEintrag =
                eigeneEintraege[
                    eigeneEintraege.length
                    -
                    1
                ];
        }


        /* -------------------------------------------------
           Seite aufbauen

           TRUE bedeutet:
           Beim ersten Start unsichtbar zur aktuellen
           Vorlesung positionieren.
        ------------------------------------------------- */

        await baueAnsicht(
            true
        );


    } catch (fehler) {

        document
            .getElementById(
                "status"
            )
            .textContent =
                "Fehler";


        document
            .getElementById(
                "fehler"
            )
            .textContent =
                fehler.message;


        console.error(
            fehler
        );


        /*
            Ganz wichtig:

            Auch bei einem Fehler darf die Seite nicht
            unsichtbar bleiben.
        */

        zeigeSeite();
    }
}


/* =========================================================
   Sicherheits-Fallback

   Sollte ein unerwarteter Browserfehler verhindern,
   dass zeigeSeite() erreicht wird, wird die Oberfläche
   spätestens nach 8 Sekunden trotzdem freigegeben.
========================================================= */

setTimeout(
    function() {

        if (
            document.body.classList.contains(
                "startet"
            )
        ) {

            zeigeSeite();
        }

    },
    8000
);


/* =========================================================
   Los
========================================================= */

starteSeite();


</script>
